function g_memoria(topic, diff, mode, customPairs){
  diff = diff || state.gameDiff || 'media';
  mode = mode || state.memMode || 'qa';
  state.memMode = mode;

  // Cantidad libre: mínimo 8, sin máximo (solo limita lo disponible en el tema)
  let nPairs = customPairs!=null ? customPairs : (state.gameCount!=null ? state.gameCount : 8);
  nPairs = Math.max(8, parseInt(nPairs,10) || 8);

  let cards = [];
  let useImages = false;
  let modeLabel = '';

  if(mode === 'img'){
    useImages = true;
    modeLabel = '🖼️ Imágenes pares';

    // Banco de fotos: locales (biodiversidad) + catálogo Wikimedia del tema
    let base = [];
    if(topic==='biodiversidad' && CURRICULUM.b64 && Object.keys(CURRICULUM.b64).length > 0){
      Object.keys(CURRICULUM.b64).forEach(k=>{
        const item = CURRICULUM.b64[k];
        base.push({key:k, url:item.img, label:item.label});
      });
    }
    const remote = (MEM_TOPIC_IMAGES[topic] || MEM_TOPIC_IMAGES.celula || []).slice();
    remote.forEach(r=>{
      if(!base.find(p=>p.key===r.k || p.url===r.url)) base.push({key:r.k, url:r.url, label:r.label});
    });
    if(!base.length){
      // fallback mínimo
      base = (MEM_TOPIC_IMAGES.celula||[]).map(r=>({key:r.k, url:r.url, label:r.label}));
    }

    // Si piden más pares que imágenes únicas, repetir el banco con keys distintos
    // (cada par sigue siendo 2 cartas iguales entre sí)
    let pool = [];
    let cycle = 0;
    while(pool.length < nPairs && base.length){
      const batch = shuffle(base.slice());
      batch.forEach(p=>{
        if(pool.length >= nPairs) return;
        pool.push({
          key: p.key + '_c' + cycle,
          url: p.url,
          label: p.label
        });
      });
      cycle++;
      if(cycle > 50) break; // seguridad
    }

    pool.forEach(p=>{
      const imgHtml = '<img src="'+p.url+'" alt="'+esc(p.label)+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:10px">';
      cards.push({key:p.key, text:imgHtml, isImg:true, label:p.label});
      cards.push({key:p.key, text:imgHtml, isImg:true, label:p.label});
    });
  } else {
    // Pregunta y respuesta — cantidad libre (mín. 8)
    useImages = false;
    modeLabel = '📝 Pregunta y respuesta';
    const allFlash = CURRICULUM.flash[topic]||[];
    if(!allFlash.length){
      gameArea().innerHTML='<div class="card"><p>No hay fichas para este tema.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';
      return;
    }
    // Repetir banco si piden más pares que fichas
    let pool = [];
    let cycle = 0;
    while(pool.length < nPairs && allFlash.length){
      const batch = shuffle(allFlash.slice());
      batch.forEach(f=>{
        if(pool.length >= nPairs) return;
        pool.push({f:f, cycle:cycle});
      });
      cycle++;
      if(cycle > 50) break;
    }
    pool.forEach((item,i)=>{
      const f = item.f;
      const qFont = f.q.length>50?'10px':(f.q.length>30?'11px':'13px');
      const aFont = f.a.length>50?'10px':(f.a.length>30?'11px':'13px');
      const key = i; // unique pair id
      cards.push({
        key:key,
        text:'<div style="font-size:10px;font-weight:700;color:var(--g600);margin-bottom:4px;">PREGUNTA</div><div style="font-size:'+qFont+';font-weight:700;padding:4px;line-height:1.3;text-align:center">'+esc(f.q)+'</div>'
      });
      cards.push({
        key:key,
        text:'<div style="font-size:10px;font-weight:700;color:var(--b600);margin-bottom:4px;">RESPUESTA</div><div style="font-size:'+aFont+';padding:4px;line-height:1.3;text-align:center">'+esc(f.a)+'</div>'
      });
    });
  }

  if(cards.length < 4){
    gameArea().innerHTML='<div class="card"><p>No hay suficientes datos para este tema en este modo. Prueba otra dificultad o el otro tipo de juego.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';
    return;
  }

  shuffleA(cards);
  state.gameData={
    cards:cards, flipped:[], matched:[], moves:0,
    diff:diff, mode:mode, awarded:false, cols:4, useImages:useImages, modeLabel:modeLabel
  };
  drawMemory();
}

function drawMemory(){
  const g=state.gameData;
  if(!g||!g.cards) return;
  const done = g.matched.length === g.cards.length;
  const diffLabel = (GAME_DIFFS.find(d=>d.id===g.diff)||{}).name || g.diff;
  const countLabel = g.cards ? (g.cards.length/2)+' pares' : '';
  const modeLabel = g.modeLabel || (g.mode==='img'?'🖼️ Imágenes pares':'📝 Pregunta y respuesta');
  const hint = g.mode==='img'
    ? 'Encuentra las <b>dos cartas iguales</b> de cada par.'
    : 'Une cada <b>pregunta</b> con su <b>respuesta</b>.';

  gameArea().innerHTML=`<div class="card">
    <div class="flex justify-between items-center mb-2 wrap gap-2">
      <b>🧠 Memoria · ${diffLabel} · ${g.cards.length/2} pares</b>
      <div style="font-size:13px;color:var(--gray500)">${modeLabel}</div>
    </div>
    <div class="flex justify-between items-center mb-3 wrap gap-2">
      <p style="font-size:12px;color:var(--gray500);margin:0;">${hint}</p>
      <div style="font-size:13px;color:var(--gray500);white-space:nowrap;">Mov: ${g.moves} · Pares: ${g.matched.length/2}/${g.cards.length/2}</div>
    </div>
    <div class="memory-grid" style="grid-template-columns:repeat(4,1fr);max-width:${g.cards.length>16?'560px':'480px'}">${g.cards.map((card,i)=>{
      const isF=g.flipped.includes(i), isM=g.matched.includes(i);
      return `<div class="memory-card ${isF||isM?'flipped':''} ${isM?'matched':''}" onclick="memFlip(${i})">${isF||isM?card.text:'🌿'}</div>`;
    }).join('')}</div>
    ${done?`<div class="quiz-result"><div class="quiz-result-emoji">🎉</div><h2>¡Completado!</h2>
      <p>En <b>${g.moves}</b> movimientos · ${diffLabel} · ${modeLabel}</p>
      <button class="btn-primary" onclick="g_memoria(state.gameTopic, state.gameDiff, state.memMode, state.gameCount)">Jugar de nuevo</button>
      <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`:''}
  </div>`;

  if(done && !g.awarded){
    g.awarded=true;
    const base = g.diff==='facil'?25:(g.diff==='dificil'?60:40);
    const xp = Math.max(15, base - Math.max(0, g.moves - g.cards.length));
    endGame(xp, 'Memoria '+modeLabel);
  }
}

function memFlip(i){
  const g=state.gameData;
  if(!g || g.matched.includes(i) || g.flipped.includes(i) || g.flipped.length>=2 || g.matched.length===g.cards.length) return;
  g.flipped.push(i);
  g.moves++;
  drawMemory();
  if(g.flipped.length===2){
    const [a,b]=g.flipped;
    if(g.cards[a].key===g.cards[b].key){
      g.matched.push(a,b);
      g.flipped=[];
      setTimeout(drawMemory, 450);
    } else {
      setTimeout(()=>{ g.flipped=[]; drawMemory(); }, 850);
    }
  }
}

function g_imagenes(topic, diff, customN){
  diff = diff || state.gameDiff || 'media';
  if(!CURRICULUM.b64){gameArea().innerHTML='<div class="card"><p>Sin imágenes disponibles.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';return;}
  let keys=shuffle(Object.keys(CURRICULUM.b64));
  let n = customN!=null ? customN : (state.gameCount!=null ? state.gameCount : 8);
  n = Math.max(8, parseInt(n,10)||8);
  // repetir ciclo de fotos si pide más que las disponibles
  let out=[];
  while(out.length < n && keys.length){ out = out.concat(shuffle(keys.slice())); }
  keys = out.slice(0,n);
  state.gameData={keys:keys,i:0,score:0,diff:diff,awarded:false};
  drawImg();
}

  const g=state.gameData;const key=g.keys[g.i];const item=CURRICULUM.b64[key];
  const opts=shuffle([key].concat(shuffle(Object.keys(CURRICULUM.b64).filter(k=>k!==key)).slice(0,3)));
  gameArea().innerHTML=`<div class="card" style="max-width:520px;margin:0 auto;">

// ---- SOPA DE LETRAS ----
function buildSopaWordBank(topic, maxLen){
  maxLen = maxLen || 16;
  const set = new Set();
  function add(w){
    w = norm(String(w||'')).replace(/ñ/g,'n').toUpperCase().replace(/[^A-Z]/g,'');
    if(w.length>=3 && w.length<=maxLen) set.add(w);
  }
  (CURRICULUM.keywords[topic]||[]).forEach(add);
  (CURRICULUM.flash[topic]||[]).forEach(f=>{
    String(f.q||'').split(/[\s,.;:¿?¡!]+/).forEach(add);
    String(f.a||'').split(/[\s,.;:¿?¡!]+/).forEach(add);
  });
  (CURRICULUM.quiz[topic]||[]).forEach(q=>{
    String(q.q||'').split(/[\s,.;:¿?¡!]+/).forEach(add);
    (q.o||[]).forEach(o=>String(o).split(/[\s,.;:¿?¡!]+/).forEach(add));
  });
  const stop = new Set(['QUE','UNA','LOS','LAS','DEL','POR','CON','PARA','COMO','MAS','ESTA','ESTE','SON','SER','TIENE','HAY','TODO','CUAL','CUANDO','DONDE','SOBRE','ENTRE','DESDE','HASTA','TAMBIEN','MUY','SIN','SUS','THE','AND','FOR','DE','LA','EL','EN','UN','SE','AL','LO','SU','NO','ES','O','Y','A']);
  return shuffle([...set].filter(w=>!stop.has(w) && w.length>=4));
}

function placeWordsOnGrid(words, N){
  const grid=Array.from({length:N},()=>Array(N).fill(''));
  const dirs=[[0,1],[1,0],[1,1],[0,-1],[1,-1],[-1,0],[-1,1],[-1,-1]];
  const placed=[];
  // ordenar por longitud desc para colocar primero las largas
  const ordered = words.slice().sort((a,b)=>b.length-a.length);
  ordered.forEach(w=>{
    let ok=false;
    for(let tries=0;tries<800 && !ok;tries++){
      const d=dirs[Math.floor(Math.random()*dirs.length)];
      const r=Math.floor(Math.random()*N), col=Math.floor(Math.random()*N);
      const er=r+d[0]*(w.length-1), ec=col+d[1]*(w.length-1);
      if(er<0||er>=N||ec<0||ec>=N) continue;
      let fit=true;
      for(let i=0;i<w.length;i++){
        const cell=grid[r+d[0]*i][col+d[1]*i];
        if(cell && cell!==w[i]){fit=false;break;}
      }
      if(!fit) continue;
      for(let i=0;i<w.length;i++) grid[r+d[0]*i][col+d[1]*i]=w[i];
      placed.push(w);
      ok=true;
    }
  });
  return {grid, placed};
}

function g_sopaletras(topic, diff, customWords){
  diff = diff || state.gameDiff || 'media';
  let nWant = customWords!=null ? customWords : (state.gameCount!=null ? state.gameCount : 8);
  nWant = Math.max(8, parseInt(nWant,10)||8);

  // Grilla lo bastante grande para caber nWant palabras
  let N = Math.min(20, Math.max(10, Math.ceil(Math.sqrt(nWant * 14))));
  let pool = buildSopaWordBank(topic, N-1);
  // Si el banco es corto, ampliar maxLen y reintentar
  if(pool.length < nWant){
    pool = buildSopaWordBank(topic, 18);
  }
  // Tomar exactamente las pedidas (o todas si hay menos en el banco)
  let words = pool.slice(0, Math.min(nWant, pool.length));
  if(!words.length){
    gameArea().innerHTML='<div class="card"><p>No hay palabras suficientes para este tema.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';
    return;
  }

  // Intentar colocar TODAS; si falla alguna, agrandar grilla y reintentar (máx 3 veces)
  let result={grid:null, placed:[]};
  for(let attempt=0; attempt<4; attempt++){
    result = placeWordsOnGrid(words, N);
    if(result.placed.length === words.length) break;
    N = Math.min(22, N+2);
  }
  // Lista final = las que realmente están en la grilla (idealmente = words)
  // Si aún falta alguna, usar solo colocadas PERO avisar - better: force include by filling leftover words as horizontal on new rows - skip
  const finalWords = result.placed.slice();
  // Completar celdas vacías
  const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<N;r++)for(let col=0;col<N;col++)if(!result.grid[r][col]) result.grid[r][col]=ABC[Math.floor(Math.random()*ABC.length)];

  state.gameData={
    grid:result.grid, N:N, words:finalWords, found:[], foundCells:[], anchor:null,
    diff:diff, awarded:false, wordTarget:finalWords.length, wanted:nWant
  };
  drawWS();
}

function drawWS(){
  const g=state.gameData;
  const allList = g.words.map(w=>`<span class="badge ${g.found.includes(w)?'badge-green':'badge-amber'}" style="margin:2px;">${g.found.includes(w)?'✓ ':''}${w}</span>`).join('');
  const note = (g.wanted && g.words.length < g.wanted)
    ? `<p style="font-size:11px;color:var(--a500);margin-bottom:6px;">Se colocaron ${g.words.length} de ${g.wanted} pedidas (límite del banco de palabras del tema).</p>`
    : '';
  gameArea().innerHTML=`<div class="card" style="max-width:560px;margin:0 auto;">
    <div class="flex justify-between items-center mb-2 wrap gap-2">
      <b>🔤 Sopa de letras${g.diff?' · '+((GAME_DIFFS.find(d=>d.id===g.diff)||{}).name||''):''}</b>
      <span style="font-size:12px;color:var(--gray500)">${g.found.length}/${g.words.length} encontradas</span>
    </div>
    ${note}
    <p style="font-size:12px;color:var(--gray500);margin-bottom:8px;">Toca la primera y la última letra. <b>Palabras a buscar (${g.words.length}):</b></p>
    <div class="flex gap-2 wrap mb-3" style="max-height:140px;overflow-y:auto;padding:4px;">${allList}</div>
    <div class="ws-grid" style="grid-template-columns:repeat(${g.N},1fr);max-width:100%;">${g.grid.map((row,r)=>row.map((ch,col)=>{
      const idx=r*g.N+col;const isSel=g.anchor===idx;
      const isFound=g.foundCells&&g.foundCells.includes(idx);
      return `<div class="ws-cell ${isSel?'sel':''} ${isFound?'found':''}" onclick="wsTap(${r},${col})">${ch}</div>`;
    }).join('')).join('')}</div>
    ${g.found.length===g.words.length?`<div class="quiz-result"><div class="quiz-result-emoji">🎉</div><h2>¡Las encontraste todas!</h2><p>${g.words.length} palabras</p>
      <button class="btn-primary" onclick="g_sopaletras(state.gameTopic, state.gameDiff, state.gameCount)">Otra sopa</button>
      <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`:''}
  </div>`;
  if(g.found.length===g.words.length&&!g.awarded){
    g.awarded=true;
    endGame(30 + g.words.length*4,'Sopa de letras');
  }
}

function wsTap(r,c){
  const g=state.gameData;const idx=r*g.N+c;
  if(g.anchor===null){g.anchor=idx;drawWS();return;}
  const ar=Math.floor(g.anchor/g.N),ac=g.anchor%g.N;
  const dr=Math.sign(r-ar),dc=Math.sign(c-ac);
  const len=Math.max(Math.abs(r-ar),Math.abs(c-ac))+1;
  let word='';let cells=[];
  if(!((ar===r||ac===c||Math.abs(r-ar)===Math.abs(c-ac))&&len>1)){g.anchor=idx;drawWS();return;}
  for(let i=0;i<len;i++){const rr=ar+dr*i,cc=ac+dc*i;word+=g.grid[rr][cc];cells.push(rr*g.N+cc);}
  const rev=word.split('').reverse().join('');
  const hit=g.words.find(w=>!g.found.includes(w)&&(w===word||w===rev));
  if(hit){g.found.push(hit);g.foundCells=(g.foundCells||[]).concat(cells);showXpPopup('✅ '+hit);}
  g.anchor=null;drawWS();
}


// ---- CRUCIGRAMA (mismas opciones de cantidad que sopa) ----
function g_crucigrama(topic, diff, customWords){
  diff = diff || state.gameDiff || 'media';
  let nWant = customWords!=null ? customWords : (state.gameCount!=null ? state.gameCount : 8);
  nWant = Math.max(8, parseInt(nWant,10)||8);

  let pool = buildSopaWordBank(topic, 12);
  if(pool.length < nWant) pool = buildSopaWordBank(topic, 16);
  let words = pool.slice(0, Math.min(nWant, pool.length));
  if(words.length < 4){
    gameArea().innerHTML='<div class="card"><p>No hay suficientes palabras para el crucigrama.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';
    return;
  }

  // Generar crucigrama simple: primera palabra horizontal al centro, resto cruzando
  const slots = buildCrossword(words);
  if(!slots.length){
    gameArea().innerHTML='<div class="card"><p>No se pudo armar el crucigrama. Prueba otra cantidad.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';
    return;
  }

  // Bounds
  let minR=99,minC=99,maxR=0,maxC=0;
  slots.forEach(s=>{
    for(let i=0;i<s.word.length;i++){
      const r = s.dir==='H' ? s.r : s.r+i;
      const col = s.dir==='H' ? s.c+i : s.c;
      minR=Math.min(minR,r); minC=Math.min(minC,col);
      maxR=Math.max(maxR,r); maxC=Math.max(maxC,col);
    }
  });
  const rows = maxR-minR+1, cols = maxC-minC+1;
  // Normalize positions
  slots.forEach(s=>{ s.r-=minR; s.c-=minC; });

  // Cell map: null=block, ''=empty letter cell, 'A'=filled
  const cells = Array.from({length:rows},()=>Array.from({length:cols},()=>null));
  const numAt = {}; // "r,c" -> clue number
  let clueNum=1;
  const cluesH=[], cluesV=[];
  slots.forEach(s=>{
    const key=s.r+','+s.c;
    if(!numAt[key]){ numAt[key]=clueNum++; }
    s.num = numAt[key];
    for(let i=0;i<s.word.length;i++){
      const r = s.dir==='H' ? s.r : s.r+i;
      const col = s.dir==='H' ? s.c+i : s.c;
      cells[r][col] = '';
    }
    if(s.dir==='H') cluesH.push(s); else cluesV.push(s);
  });

  state.gameData={
    type:'crucigrama', cells:cells, slots:slots, cluesH:cluesH, cluesV:cluesV,
    rows:rows, cols:cols, numAt:numAt, answers:{}, diff:diff, awarded:false,
    words:slots.map(s=>s.word), found:[], wanted:nWant
  };
  drawCrucigrama();
}

function buildCrossword(words){
  // words sorted by length desc
  const list = words.slice().sort((a,b)=>b.length-a.length);
  const placed=[];
  // place first horizontal at 0,0
  if(!list.length) return [];
  placed.push({word:list[0], r:0, c:0, dir:'H'});
  for(let wi=1; wi<list.length; wi++){
    const w=list[wi];
    let done=false;
    // try cross with each placed word
    for(let pi=0; pi<placed.length && !done; pi++){
      const p=placed[pi];
      for(let i=0;i<p.word.length && !done;i++){
        for(let j=0;j<w.length && !done;j++){
          if(p.word[i]!==w[j]) continue;
          // new word perpendicular
          let nr,nc,dir;
          if(p.dir==='H'){
            dir='V'; nr=p.r-j; nc=p.c+i;
          } else {
            dir='H'; nr=p.r+i; nc=p.c-j;
          }
          if(canPlaceCW(placed, w, nr, nc, dir)){
            placed.push({word:w, r:nr, c:nc, dir:dir});
            done=true;
          }
        }
      }
    }
    // if not crossed, place below with gap
    if(!done){
      let maxR=0;
      placed.forEach(p=>{
        const end = p.dir==='V' ? p.r+p.word.length-1 : p.r;
        maxR=Math.max(maxR,end);
      });
      placed.push({word:w, r:maxR+2, c:0, dir:'H'});
    }
  }
  return placed;
}

function canPlaceCW(placed, w, r, c, dir){
  // check no conflict with existing letters; allow same letter overlap
  const letters={};
  placed.forEach(p=>{
    for(let i=0;i<p.word.length;i++){
      const rr = p.dir==='H'?p.r:p.r+i;
      const cc = p.dir==='H'?p.c+i:p.c;
      letters[rr+','+cc]=p.word[i];
    }
  });
  for(let i=0;i<w.length;i++){
    const rr = dir==='H'?r:r+i;
    const cc = dir==='H'?c+i:c;
    const key=rr+','+cc;
    if(letters[key] && letters[key]!==w[i]) return false;
  }
  // at least one overlap preferred but not required if isolated
  return true;
}

function drawCrucigrama(){
  const g=state.gameData;
  const cellSize = Math.max(22, Math.min(32, Math.floor(480/Math.max(g.cols,1))));
  let gridHtml='<div style="display:inline-grid;grid-template-columns:repeat('+g.cols+', '+cellSize+'px);gap:1px;background:var(--gray300);padding:1px;border-radius:8px;">';
  for(let r=0;r<g.rows;r++){
    for(let col=0;col<g.cols;col++){
      if(g.cells[r][col]===null){
        gridHtml+='<div style="width:'+cellSize+'px;height:'+cellSize+'px;background:var(--gray800);"></div>';
      } else {
        const key=r+','+col;
        const num=g.numAt[key];
        const val=(g.answers[key]||'');
        gridHtml+=`<div style="width:${cellSize}px;height:${cellSize}px;background:#fff;position:relative;">
          ${num?`<span style="position:absolute;top:1px;left:2px;font-size:8px;font-weight:700;color:var(--gray500)">${num}</span>`:''}
          <input maxlength="1" value="${val}" data-r="${r}" data-c="${col}"
            style="width:100%;height:100%;border:none;text-align:center;font-weight:800;font-size:${Math.floor(cellSize*0.45)}px;text-transform:uppercase;padding:0;outline:none;"
            oninput="cwInput(this)" />
        </div>`;
      }
    }
  }
  gridHtml+='</div>';

  const clueH = g.cluesH.map(s=>`<div style="font-size:12px;margin-bottom:4px;"><b>${s.num}.</b> ${cwClueFor(s.word)}</div>`).join('');
  const clueV = g.cluesV.map(s=>`<div style="font-size:12px;margin-bottom:4px;"><b>${s.num}.</b> ${cwClueFor(s.word)}</div>`).join('');

  gameArea().innerHTML=`<div class="card" style="max-width:640px;margin:0 auto;">
    <div class="flex justify-between items-center mb-2 wrap gap-2">
      <b>📰 Crucigrama · ${g.words.length} palabras</b>
      <span style="font-size:12px;color:var(--gray500)">${g.found.length}/${g.words.length} resueltas</span>
    </div>
    <p style="font-size:12px;color:var(--gray500);margin-bottom:10px;">Escribe una letra por casilla. Las pistas están abajo.</p>
    <div style="overflow-x:auto;text-align:center;margin-bottom:14px;">${gridHtml}</div>
    <div class="grid-2 gap-3">
      <div><b style="font-size:13px;color:var(--g700);">→ Horizontales</b>${clueH||'<p style="font-size:12px;color:var(--gray400)">—</p>'}</div>
      <div><b style="font-size:13px;color:var(--b600);">↓ Verticales</b>${clueV||'<p style="font-size:12px;color:var(--gray400)">—</p>'}</div>
    </div>
    <div class="flex gap-2 mt-3 wrap">
      <button class="btn-primary" onclick="cwCheck()">✓ Comprobar</button>
      <button class="btn-secondary" onclick="g_crucigrama(state.gameTopic, state.gameDiff, state.gameCount)">Otro crucigrama</button>
      <button class="btn-secondary" onclick="closeGame()">Cerrar</button>
    </div>
    <div id="cw-msg" style="font-size:13px;margin-top:10px;color:var(--gray500);"></div>
  </div>`;
}

function cwClueFor(word){
  // pista desde flash/keywords: definición si existe
  const topic=state.gameTopic;
  const flash=(CURRICULUM.flash[topic]||[]);
  for(const f of flash){
    const a=norm(f.a||'').replace(/ñ/g,'n').toUpperCase().replace(/[^A-Z]/g,'');
    const q=norm(f.q||'');
    if(a===word || a.includes(word)) return esc(f.q);
    // si la palabra aparece en la pregunta, usar respuesta corta
    if(norm(f.q).toUpperCase().replace(/[^A-Z]/g,'').includes(word) && f.a) return esc(String(f.a).substring(0,80));
  }
  return 'Palabra de '+word.length+' letras ('+word[0]+'…)';
}

function cwInput(el){
  const g=state.gameData;
  const r=+el.dataset.r, col=+el.dataset.c;
  const v=(el.value||'').toUpperCase().replace(/[^A-ZÑ]/g,'').slice(0,1);
  el.value=v;
  g.answers[r+','+col]=v;
}

function cwCheck(){
  const g=state.gameData;
  let okSlots=0;
  g.found=[];
  g.slots.forEach(s=>{
    let built='';
    for(let i=0;i<s.word.length;i++){
      const r = s.dir==='H' ? s.r : s.r+i;
      const col = s.dir==='H' ? s.c+i : s.c;
      built += (g.answers[r+','+col]||'');
    }
    if(built===s.word){ okSlots++; if(!g.found.includes(s.word)) g.found.push(s.word); }
  });
  const msg=document.getElementById('cw-msg');
  if(okSlots===g.slots.length){
    if(msg) msg.innerHTML='🎉 <b>¡Crucigrama completo!</b>';
    if(!g.awarded){ g.awarded=true; endGame(40+g.slots.length*5,'Crucigrama'); }
    drawCrucigrama();
  } else {
    if(msg) msg.textContent='Correctas: '+okSlots+' / '+g.slots.length+'. Sigue intentando.';
    showXpPopup(okSlots+' / '+g.slots.length+' palabras bien');
  }
}


// ---- COMPLETAR PALABRAS (ahorcado amable) ----
function g_completar(topic, diff, customN){
  diff = diff || state.gameDiff || 'media';
  let n = customN!=null ? customN : (state.gameCount!=null ? state.gameCount : 8);
  n = Math.max(8, parseInt(n,10)||8);
  const lives = {facil:8, media:6, dificil:5}[diff] || 6;
  let bank = buildSopaWordBank(topic, 14);
  if(!bank.length) bank = shuffle((CURRICULUM.keywords[topic]||[]).map(w=>norm(w).replace(/ñ/g,'n').toUpperCase()).filter(w=>w.length>=3));
  while(bank.length < n && bank.length) bank = bank.concat(bank.slice());
  const words = bank.slice(0,n);
  state.gameData={words:words,wi:0,guessed:[],lives:lives,maxLives:lives,diff:diff,awarded:false};
  drawHang();
}
function drawHang(){
  const g=state.gameData;const w=g.words[g.wi];
  const display=w.split('').map(ch=>g.guessed.includes(ch)?ch:'_').join(' ');
  const faces=['😀','🙂','😐','😟','😨','😰','💀'];
  const done=!display.includes('_');
  gameArea().innerHTML=`<div class="card" style="max-width:480px;margin:0 auto;text-align:center;">
    <div class="flex justify-between mb-2"><b>📝 Completar palabras</b><span style="font-size:13px;color:var(--gray500)">Palabra ${g.wi+1}/${g.words.length}</span></div>
    <div style="font-size:40px">${faces[6-g.lives]}</div>
    <div style="font-size:13px;color:var(--gray500)">Pista: tema "${CURRICULUM.topics.find(t=>t.id===state.gameTopic).name}" · Vidas: ${g.lives}</div>
    <div class="hm-word">${display}</div>
    ${done?`<button class="btn-primary" onclick="hangNext()">${g.wi<g.words.length-1?'Siguiente palabra':'Ver resultado'}</button>`:`
    <div class="hm-letters">${'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('').filter(l=>!g.guessed.includes(l)).map(l=>`<button class="hm-letter" onclick="hangPick('${l}')">${l}</button>`).join('')}</div>`}
  </div>`;
}
function hangPick(l){
  const g=state.gameData;const w=g.words[g.wi];
  g.guessed.push(l);
  if(!w.includes(l))g.lives--;
  if(g.lives<=0){showXpPopup('💀 Era: '+w);g.wi++;g.guessed=[];g.lives=g.maxLives;if(g.wi>=g.words.length){hangEnd();return;}}
  drawHang();
}
function hangNext(){const g=state.gameData;g.wi++;g.guessed=[];g.lives=g.maxLives;if(g.wi>=g.words.length){hangEnd();return;}drawHang();}
function hangEnd(){const g=state.gameData;gameArea().innerHTML=`<div class="quiz-result"><div class="quiz-result-emoji">🎉</div><h2>¡Ronda de palabras!</h2><button class="btn-primary" onclick="g_completar(state.gameTopic, state.gameDiff)">Otra vez</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;if(!g.awarded){g.awarded=true;endGame({facil:25,media:40,dificil:60}[g.diff]||40,'Completar palabras');}}

// ---- ORDENAR ----
function g_ordenar(topic, diff){
  diff = diff || state.gameDiff || 'media';
  const list = CURRICULUM.secuencias[topic]||[];
  if(!list.length){gameArea().innerHTML='<div class="card"><p>Sin secuencias para este tema.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';return;}
  // difícil: secuencia más larga si hay varias
  let seq = list[Math.floor(Math.random()*list.length)];
  if(diff==='dificil' && list.length>1){
    seq = list.slice().sort((a,b)=>b.steps.length-a.steps.length)[0];
  } else if(diff==='facil' && list.length>1){
    seq = list.slice().sort((a,b)=>a.steps.length-b.steps.length)[0];
  }
  state.gameData={name:seq.name,steps:seq.steps,pool:shuffle(seq.steps.slice()),placed:[],diff:diff,awarded:false};
  drawSeq();
}
function drawSeq(){
  const g=state.gameData;
  if(g.placed.length===g.steps.length){
    gameArea().innerHTML=`<div class="quiz-result"><div class="quiz-result-emoji">🎉</div><h2>¡Secuencia correcta!</h2><p>${g.name}</p>
      <button class="btn-primary" onclick="g_ordenar(state.gameTopic, state.gameDiff)">Otra secuencia</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;
    if(!g.awarded){g.awarded=true;endGame({facil:25,media:40,dificil:55}[g.diff]||40,'Ordenar');}return;
  }
  gameArea().innerHTML=`<div class="card" style="max-width:520px;margin:0 auto;">
    <b>🔢 Ordenar: ${g.name}</b><p style="font-size:12px;color:var(--gray500)" class="mb-3">Toca los pasos en el orden correcto.</p>
    <div style="margin-bottom:12px;">${g.placed.map((s,i)=>`<div class="seq-slot"><b style="color:var(--g600);margin-right:8px">${i+1}.</b> ${esc(s)}</div>`).join('')}
      ${g.placed.length<g.steps.length?`<div class="seq-slot" style="color:var(--gray400)">Siguiente paso...</div>`:''}</div>
    ${g.pool.filter(s=>!g.placed.includes(s)).map(s=>`<button class="seq-item" onclick="seqPick('${s.replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('')}
  </div>`;
}
function seqPick(s){
  const g=state.gameData;
  if(g.steps[g.placed.length]===s){g.placed.push(s);showXpPopup('✅');}
  else showXpPopup('❌ Ese no va ahí');
  drawSeq();
}

// ---- RULETA ----
function g_ruleta(topic, diff, customN){
  diff = diff || state.gameDiff || 'media';
  const colors=['#16a34a','#2563eb','#f59e0b','#dc2626','#8b5cf6','#0d9488','#db2777','#65a30d'];
  const vals=[10,20,30,40,50,60,70,80];
  let spins = customN!=null ? customN : (state.gameCount!=null ? state.gameCount : 8);
  spins = Math.max(8, parseInt(spins,10)||8);
  state.gameData={colors:colors,vals:vals,angle:0,spins:spins,q:null,diff:diff,awarded:false};
  drawWheel();
}
function drawWheel(){
  const g=state.gameData;
  const grad=g.colors.map((c,i)=>`${c} ${i*45}deg ${(i+1)*45}deg`).join(',');
  const segs=g.colors.map((c,i)=>`<div class="wheel-seg" style="transform:rotate(${i*45}deg);background:linear-gradient(45deg,${c},${c})">${g.vals[i]}</div>`).join('');
  gameArea().innerHTML=`<div class="card" style="max-width:480px;margin:0 auto;text-align:center;">
    <b>🎡 Ruleta de preguntas</b><p style="font-size:13px;color:var(--gray500)">Giros restantes: ${g.spins}</p>
    <div class="wheel-wrap" style="margin:16px auto;">
      <div class="wheel-pointer">🔻</div>
      <div class="wheel" style="background:conic-gradient(${grad});" id="wheel">${segs}</div>
    </div>
    <button class="btn-primary" id="spin-btn" onclick="spinWheel()">🎡 ¡GIRAR!</button>
    <div id="wheel-q" class="mt-3"></div>
  </div>`;
}
function spinWheel(){
  const g=state.gameData;const btn=document.getElementById('spin-btn');
  btn.disabled=true;
  const extra=1800+Math.floor(Math.random()*1800);
  g.angle+=extra;
  const wheel=document.getElementById('wheel');
  wheel.style.transform=`rotate(${g.angle}deg)`;
  setTimeout(()=>{
    const mod=((360-(g.angle%360))%360);
    const seg=Math.floor(mod/45);
    const pts=g.vals[seg];
    g.spins--;
    const q=CURRICULUM.quiz[state.gameTopic][Math.floor(Math.random()*CURRICULUM.quiz[state.gameTopic].length)];
    const wq=document.getElementById('wheel-q');
    wq.innerHTML=`<div class="quiz-question" style="text-align:left;">
      <div class="quiz-qnum">Pregunta por ${pts} pts</div><div class="quiz-text" style="font-size:16px">${q.q}</div>
      ${q.o.map((o,oi)=>`<button class="quiz-option" onclick="wheelAns(${oi},${q.a},${pts})"><div class="quiz-opt-letter">${String.fromCharCode(65+oi)}</div><span>${esc(o)}</span></button>`).join('')}
    </div>`;
  },4100);
}
function wheelAns(sel,correct,pts){
  const g=state.gameData;
  const btns=gameArea().querySelectorAll('.quiz-option');
  btns.forEach((b,i)=>{b.style.pointerEvents='none';if(i===correct)b.classList.add('correct');else if(i===sel)b.classList.add('wrong');});
  if(sel===correct){showXpPopup('✅ +'+pts+' pts');state.user.points+=pts;}
  setTimeout(()=>{
    if(g.spins<=0){gameArea().innerHTML=`<div class="quiz-result"><div class="quiz-result-emoji">🎡</div><h2>¡Ruleta terminada!</h2><button class="btn-primary" onclick="g_ruleta(state.gameTopic, state.gameDiff)">Otra ronda</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;if(!g.awarded){g.awarded=true;endGame({facil:25,media:30,dificil:40}[g.diff]||30,'Ruleta');}}
    else drawWheel();
  },1200);
}

// ---- CLASIFICACIÓN ----
function g_clasifica(topic, diff, customN){
  diff = diff || state.gameDiff || 'media';
  const data=CURRICULUM.clasificar[topic];
  if(!data){gameArea().innerHTML='<div class="card"><p>Sin datos de clasificación.</p><button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>';return;}
  let n = customN!=null ? customN : (state.gameCount!=null ? state.gameCount : 8);
  n = Math.max(8, parseInt(n,10)||8);
  let pool = shuffle(data.items.slice());
  while(pool.length < n && data.items.length) pool = pool.concat(shuffle(data.items.slice()));
  const items = pool.slice(0,n).map(it=>({t:it.t, c:it.c, done:false}));
  state.gameData={cats:data.cats,items:items,sel:null,done:0,diff:diff,awarded:false};
  drawClassify();
}
function drawClassify(){
  const g=state.gameData;
  if(g.done===g.items.length){
    gameArea().innerHTML=`<div class="quiz-result"><div class="quiz-result-emoji">🎉</div><h2>¡Clasificación perfecta!</h2><button class="btn-primary" onclick="g_clasifica(state.gameTopic, state.gameDiff)">Otra vez</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;
    if(!g.awarded){g.awarded=true;endGame({facil:30,media:50,dificil:65}[g.diff]||50,'Clasificación');}return;
  }
  gameArea().innerHTML=`<div class="card">
    <b>🗂️ Clasificación</b><p style="font-size:12px;color:var(--gray500)" class="mb-3">Toca un elemento y luego la categoría (o arrastra con el mouse).</p>
    <div class="flex gap-2 wrap mb-3">${g.items.filter(it=>!it.done).map((it,i)=>`<div class="dd-item ${g.sel===it?'sel':''}" data-t="${esc(it.t)}" onclick="clsPick('${esc(it.t)}')" ondragstart="clsDrag(event,'${esc(it.t)}')" draggable="true">${esc(it.t)}</div>`).join('')}</div>
    <div class="grid-2">${g.cats.map((c,ci)=>`<div class="dd-zone" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="clsDrop(event,${ci},this)"><div style="width:100%;text-align:center;font-weight:700;font-size:13px;color:var(--gray500);margin-bottom:4px">${c.name}</div></div>`).join('')}</div>
  </div>`;
}
function clsPick(t){const g=state.gameData;g.sel=g.items.find(x=>x.t===t);drawClassify();}
function clsAttempt(item,ci){
  const g=state.gameData;
  if(item.c===ci){item.done=true;g.done++;showXpPopup('✅ '+item.t);}
  else showXpPopup('❌ No pertenece ahí');
  g.sel=null;drawClassify();
}
function clsDrag(ev,t){ev.dataTransfer.setData('t',t);}
function clsDrop(ev,ci,zone){ev.preventDefault();zone.classList.remove('drag-over');const t=ev.dataTransfer.getData('t');const item=state.gameData.items.find(x=>x.t===t);if(item)clsAttempt(item,ci);}

// ---- CARRERA DE PREGUNTAS ----
function g_carrera(topic, diff, customN){
  diff = diff || state.gameDiff || 'media';
  let time = customN!=null ? customN : (state.gameCount!=null ? state.gameCount : 45);
  time = Math.max(15, parseInt(time,10)||45);
  state.gameData={qs:shuffle(CURRICULUM.quiz[topic]||[]),i:0,score:0,time:time,over:false,diff:diff,awarded:false};
  drawRace();
  state.gameData.iv=setInterval(()=>{
    const g=state.gameData;if(!g||g.over)return;g.time--;
    const t=document.getElementById('race-timer');
    if(t)t.textContent='⏱️ '+g.time+'s';
    if(g.time<=0){clearInterval(g.iv);g.over=true;raceEnd();}
  },1000);
}
function drawRace(){
  const g=state.gameData;
  if(g.over)return;
  if(g.i>=g.qs.length){shuffleA(g.qs);g.i=0;}
  const q=g.qs[g.i];
  gameArea().innerHTML=`<div class="quiz-container"><div class="quiz-question">
    <div class="flex justify-between items-center mb-2"><span class="quiz-qnum">🏃 Carrera · Aciertos: ${g.score}</span><span class="exam-timer ${g.time<10?'danger':''}" id="race-timer">⏱️ ${g.time}s</span></div>
    <div class="quiz-text">${q.q}</div>
    ${q.o.map((o,oi)=>`<button class="quiz-option" onclick="raceAns(${oi},${q.a})"><div class="quiz-opt-letter">${String.fromCharCode(65+oi)}</div><span>${esc(o)}</span></button>`).join('')}
  </div></div>`;
}
function raceAns(sel,correct){
  const g=state.gameData;if(g.over)return;
  const btns=gameArea().querySelectorAll('.quiz-option');
  btns.forEach((b,i)=>{b.style.pointerEvents='none';if(i===correct)b.classList.add('correct');else if(i===sel)b.classList.add('wrong');});
  if(sel===correct){g.score++;state.user.totalQuizCorrect=(state.user.totalQuizCorrect||0)+1;DB.saveUser(state.user);}
  g.i++;setTimeout(drawRace,700);
}
function raceEnd(){
  const g=state.gameData;
  gameArea().innerHTML=`<div class="quiz-result"><div class="quiz-result-emoji">🏁</div><h2>¡Tiempo!</h2><p>Aciertos: ${g.score}</p>
    <button class="btn-primary" onclick="g_carrera(state.gameTopic, state.gameDiff)">Otra carrera</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;

}

function drawRiddle(){

      <button class="btn-primary" onclick="g_adivinanzas(state.gameTopic, state.gameDiff)">Otras adivinanzas</button> <button class="btn-secondary" onclick="closeGame()">Cerrar</button></div>`;

  }
  gameArea().innerHTML=`<div class="quiz-container"><div class="quiz-question">

  </div></div>`;

function riddleGo(){
  const g=state.gameData;const ans=norm(document.getElementById('riddle-in').value);

  else document.getElementById('riddle-msg').innerHTML='❌ No es. Pista: empieza con "'+r.ans[0].charAt(0).toUpperCase()+'"';
}

function drawTilcayo(){

function startExam(topic,diff,customN){
  const d=DIFFS.find(x=>x.id===diff)||DIFFS[1];
  let n = customN!=null ? customN : (state.examCount!=null ? state.examCount : d.qs);
  n = Math.max(5, parseInt(n,10)||d.qs);
  const bank = shuffle((CURRICULUM.quiz[topic]||[]).slice());
  if(!bank.length){ alert('No hay preguntas para este tema'); return; }
  let qs = bank.slice();
  while(qs.length < n) qs = qs.concat(shuffle(bank.slice()));
  qs = qs.slice(0, n);
  // tiempo: ~1.5 min por pregunta, mínimo el de la dificultad
  const time = Math.max(d.time, n * 90);
  state.examTopic=topic; state.examDiff=diff;
  state.examQs=qs; state.examIndex=0; state.examScore=0; state.examTimeLeft=time;
  state.examCount=n;
  if(state.examTimer){ clearInterval(state.examTimer); state.examTimer=null; }
  render();
  state.examTimer=setInterval(()=>{
    state.examTimeLeft--;
    const el=document.getElementById('exam-timer');
    if(el){const m=Math.floor(state.examTimeLeft/60),s=state.examTimeLeft%60;
      el.textContent='⏱️ '+m+':'+String(s).padStart(2,'0');
      el.className='exam-timer '+(state.examTimeLeft<60?'danger':state.examTimeLeft<180?'warning':'');}
    if(state.examTimeLeft<=0){clearInterval(state.examTimer);state.examTimer=null;state.examIndex=999;render();}
  },1000);
}

// --- Voz estable en PC y móvil ---
let _oralVoices=[];
let _speakTimer=null;
function loadOralVoices(){
  try{ _oralVoices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }catch(e){ _oralVoices=[]; }
}
if(typeof window!=='undefined' && 'speechSynthesis' in window){
  loadOralVoices();
  try{ speechSynthesis.onvoiceschanged = loadOralVoices; }catch(e){}
}

function pickSpanishVoice(){
  loadOralVoices();
  const list=_oralVoices||[];
  return list.find(v=>/es(-|_)(MX|US|AR|CO|CL|PE|ES|419)/i.test(v.lang))
    || list.find(v=>/^es/i.test(v.lang))
    || list.find(v=>/spanish|español/i.test(v.name||''))
    || null;
}

function speak(text){
  if(!text) return;
  if(typeof window==='undefined' || !('speechSynthesis' in window)){
    const msg=document.getElementById('oral-msg');
    if(msg) msg.textContent='Tu navegador no puede leer en voz alta. Lee la pregunta en pantalla.';
    return;
  }
  const run = function(){
    try{
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang='es-ES';
      u.rate=0.95;
      u.pitch=1;
      u.volume=1;
      const voice=pickSpanishVoice();
      if(voice){ u.voice=voice; if(voice.lang) u.lang=voice.lang; }
      u.onerror=function(){
        const msg=document.getElementById('oral-msg');
        if(msg) msg.textContent='No se pudo reproducir el audio. Lee la pregunta y elige una opción.';
      };
      speechSynthesis.speak(u);
    }catch(e){
      const msg=document.getElementById('oral-msg');
      if(msg) msg.textContent='Audio no disponible. Lee la pregunta en pantalla.';
    }
  };
  // Evita el bug de Chrome/PC: cancelar y hablar en el mismo tick deja la cola trabada
  try{
    if(_speakTimer){ clearTimeout(_speakTimer); _speakTimer=null; }
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      _speakTimer=setTimeout(run, 180);
    } else {
      run();
    }
  }catch(e){ run(); }
}

function oralAnswerMatches(said, correctText, options, correctIdx){
  said = norm(said||'');
  if(!said) return false;
  const correct = norm(correctText||'');
  // 1) coincide casi toda la respuesta
  if(correct && (said.includes(correct) || correct.includes(said))) return true;
  // 2) palabras clave (>3 letras) de la respuesta correcta
  const keys = correct.split(/\s+/).filter(w=>w.length>3);
  if(keys.length && keys.filter(w=>said.includes(w)).length >= Math.ceil(keys.length*0.5)) return true;
  // 3) el usuario dijo la letra: "a", "be", "opción b"
  const letterMap={a:0,b:1,c:2,d:3,e:4};
  const m=said.match(/\b(opcion\s*)?([abcd])\b/);
  if(m && letterMap[m[2]]===correctIdx) return true;
  // 4) dijo otra opción completa por error → no
  if(options && options.length){
    let best=-1, bestLen=0;
    options.forEach((o,i)=>{
      const n=norm(o);
      if(n.length>2 && said.includes(n) && n.length>bestLen){ best=i; bestLen=n.length; }
    });
    if(best===correctIdx) return true;
    if(best>=0 && best!==correctIdx) return false;
  }
  // 5) al menos una keyword fuerte
  return keys.some(w=>w.length>5 && said.includes(w));
}

function oralListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    const msg=document.getElementById('oral-msg');
    if(msg) msg.textContent='Reconocimiento de voz no disponible. Toca una opción de respuesta.';
    return;
  }
  if(state.oralListening) return;
  if(!state.oralQs || state.oralIndex>=state.oralQs.length) return;

  const q=state.oralQs[state.oralIndex];
  const correctIdx=q.a;
  const correctText=q.o[correctIdx];
  const btn=document.getElementById('mic-btn');
  const msg=document.getElementById('oral-msg');

  // HTTPS check (móviles bloquean mic en http)
  const isSecure = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  if(!isSecure){
    if(msg) msg.innerHTML='⚠️ En el celular el micrófono solo funciona con <b>HTTPS</b>. Usa las opciones de abajo.';
    return;
  }

  state.oralListening=true;
  if(btn){ btn.textContent='🎤 Escuchando… habla ahora'; btn.disabled=true; }
  if(msg) msg.textContent='Escuchando… di tu respuesta con claridad.';

  let finished=false;
  const rec=new SR();
  rec.lang='es-ES';
  rec.interimResults=false;
  rec.maxAlternatives=3;
  rec.continuous=false;

  const cleanup=function(){
    state.oralListening=false;
    if(btn){ btn.textContent='🎤 Responder con voz'; btn.disabled=false; }
  };

  rec.onresult=function(ev){
    if(finished) return;
    finished=true;
    let said='';
    try{
      // tomar la mejor alternativa
      const alts=[];
      for(let i=0;i<ev.results[0].length;i++) alts.push(ev.results[0][i].transcript);
      said=alts[0]||'';
    }catch(e){ said=(ev.results[0][0]&&ev.results[0][0].transcript)||''; }

    cleanup();
    const hit=oralAnswerMatches(said, correctText, q.o, correctIdx);
    if(msg) msg.innerHTML = hit
      ? ('✅ Escuché: «'+esc(said)+'» — ¡Correcto!')
      : ('🎤 Escuché: «'+esc(said)+'». No coincide del todo. Toca la opción correcta abajo.');

    if(hit){
      // marcar visual y avanzar
      const btns=document.querySelectorAll('#oral-options .quiz-option');
      btns.forEach((b,i)=>{
        b.style.pointerEvents='none';
        if(i===correctIdx) b.classList.add('correct');
      });
      state.oralScore++;
      showXpPopup('✅ Correcto');
      setTimeout(function(){
        state.oralIndex++;
        try{ speechSynthesis.cancel(); }catch(e){}
        render();
      }, 1100);
    }
  };

  rec.onerror=function(ev){
    if(finished) return;
    finished=true;
    cleanup();
    const err=ev && ev.error;
    let tip='No se pudo usar el micrófono. Toca una opción.';
    if(err==='not-allowed' || err==='service-not-allowed')
      tip='Permiso de micrófono denegado. Actívalo en el navegador o toca una opción.';
    else if(err==='no-speech')
      tip='No escuché nada. Intenta de nuevo o toca una opción.';
    else if(err==='network')
      tip='Error de red en el reconocimiento de voz. Toca una opción.';
    else if(err==='aborted')
      tip='Micrófono cancelado. Puedes intentar otra vez.';
    if(msg) msg.textContent=tip;
  };

  rec.onend=function(){
    if(!finished){
      finished=true;
      cleanup();
      if(msg && msg.textContent.indexOf('Escuchando')>=0)
        msg.textContent='No capturé audio. Prueba otra vez o elige una opción.';
    }
  };

  try{
    rec.start();
  }catch(e){
    finished=true;
    cleanup();
    if(msg) msg.textContent='No se pudo iniciar el micrófono. Toca una opción de respuesta.';
  }
}

// ======================== ARRANQUE ========================
try{
  initState();
  render();
}catch(err){
  console.error('BIOEXPLORA error:', err);
  var app=document.getElementById('app');
  if(app) app.innerHTML='<div style="max-width:520px;margin:40px auto;font-family:sans-serif;padding:24px;border:2px solid #dc2626;border-radius:16px;background:#fef2f2;"><h2 style="color:#dc2626;margin-top:0;">Error al cargar BIOEXPLORA</h2><p style="color:#7f1d1d;font-size:14px;">'+String(err&&err.message||err)+'</p><pre style="font-size:11px;overflow:auto;background:#fff;padding:12px;border-radius:8px;">'+(err&&err.stack?String(err.stack).slice(0,800):'')+'</pre><p style="font-size:13px;color:#666;">Abre la consola del navegador (F12) para más detalles.</p></div>';
}
window.addEventListener('error', function(ev){
  console.error('BIOEXPLORA runtime:', ev.error||ev.message);
});
</script>
