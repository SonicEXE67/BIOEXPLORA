<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIOEXPLORA - Biología 6to Secundaria Bolivia</title>
<meta name="theme-color" content="#16a34a">
<style>
:root{--g50:#f0fdf4;--g100:#dcfce7;--g200:#bbf7d0;--g300:#86efac;--g400:#4ade80;--g500:#22c55e;--g600:#16a34a;--g700:#15803d;--g800:#166534;--g900:#14532d;--b500:#3b82f6;--b600:#2563eb;--r500:#ef4444;--r600:#dc2626;--t500:#14b8a6;--t600:#0d9488;--p500:#8b5cf6;--p600:#7c3aed;--a400:#fbbf24;--a500:#f59e0b;--gray50:#f9fafb;--gray100:#f3f4f6;--gray200:#e5e7eb;--gray300:#d1d5db;--gray400:#9ca3af;--gray500:#6b7280;--gray600:#4b5563;--gray700:#374151;--gray800:#1f2937;--gray900:#111827;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--gray50);color:var(--gray900);min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g50);padding:24px}
.auth-box{width:100%;max-width:440px;background:#fff;border-radius:20px;padding:40px 32px;box-shadow:0 20px 60px rgba(22,163,74,0.15);border:1px solid var(--g200)}
.auth-logo{text-align:center;margin-bottom:28px}.auth-logo .leaf{font-size:56px;margin-bottom:8px}
.auth-logo h1{color:var(--g800);font-size:30px;font-weight:800;letter-spacing:-0.5px}
.auth-logo p{color:var(--g600);font-size:14px;margin-top:4px}
.auth-field{margin-bottom:16px}.auth-field label{display:block;font-size:13px;font-weight:600;color:var(--gray700);margin-bottom:6px}
.auth-field input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--gray300);font-size:16px;outline:none;transition:all .2s;background:#fff}
.auth-field input:focus{border-color:var(--g500);box-shadow:0 0 0 3px rgba(22,163,74,0.12)}
.auth-btn{width:100%;padding:14px;background:var(--g600);color:#fff;border-radius:12px;font-weight:700;font-size:16px;border:none;cursor:pointer;transition:all .2s;margin-bottom:16px}
.auth-btn:hover{background:var(--g700)}.auth-btn:disabled{opacity:.6}
.auth-switch{text-align:center;font-size:14px;color:var(--gray500)}.auth-switch a{color:var(--g600);font-weight:600}
.auth-badge{margin-top:20px;padding:14px;background:var(--g50);border-radius:12px;border:1px solid var(--g200);text-align:center}
.auth-badge p{font-size:12px;color:var(--g800);line-height:1.6}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;min-height:100vh;background:#fff;border-right:1px solid var(--gray200);padding:20px 14px;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:50;overflow-y:auto}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:28px}
.sidebar-brand .logo-icon{font-size:32px}.sidebar-brand .logo-text{font-weight:800;color:var(--g800);font-size:18px;line-height:1.1}
.sidebar-brand .logo-sub{font-size:10px;color:var(--g600);font-weight:500}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--gray500);transition:all .15s;font-size:14.5px;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:var(--gray100);color:var(--gray800)}.nav-item.active{background:var(--g600);color:#fff}
.sidebar-footer{padding-top:16px;border-top:1px solid var(--gray200);margin-top:auto}
.user-mini{display:flex;align-items:center;gap:10px;padding:8px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;color:var(--g700);font-weight:700;font-size:16px;border:2px solid var(--g200)}
.user-info .user-name{font-size:13.5px;font-weight:700;color:var(--gray900)}.user-info .user-level{font-size:11px;color:var(--gray500)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;display:none}
.main-area{flex:1;margin-left:260px;min-height:100vh;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--gray200);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;gap:10px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--gray100);border-radius:12px;padding:8px 16px;width:360px;max-width:100%}
.search-box input{border:none;background:transparent;outline:none;font-size:14px;width:100%;color:var(--gray700)}.search-box input::placeholder{color:var(--gray400)}
.topbar-actions{display:flex;align-items:center;gap:12px}
.topbar-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gray500);background:var(--gray100);transition:all .15s;position:relative;font-size:17px}
.topbar-btn:hover{background:var(--gray200);color:var(--gray700)}
.hamburger{display:none}
.content{padding:24px 28px;max-width:1200px}
.card{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:20px}
.progress-bar{background:var(--gray200);border-radius:999px;height:8px;overflow:hidden}.progress-fill{height:100%;border-radius:999px;transition:width .6s ease}
.btn-primary{background:var(--g600);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary:hover{background:var(--g700)}.btn-primary:disabled{opacity:.5}
.btn-secondary{background:var(--gray100);color:var(--gray700);padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--gray200);transition:all .2s}
.btn-secondary:hover{background:var(--gray200)}.btn-danger{background:var(--r500);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px}.btn-danger:hover{background:var(--r600)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-green{background:var(--g100);color:var(--g700)}.badge-blue{background:#dbeafe;color:var(--b600)}.badge-amber{background:#fef3c7;color:#b45309}.badge-red{background:#fee2e2;color:var(--r600)}.badge-purple{background:#ede9fe;color:var(--p600)}
.hero{background:var(--g800);border-radius:20px;padding:40px 36px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:rgba(255,255,255,0.04);border-radius:50%}
.hero-inner{position:relative;z-index:1;max-width:620px}.hero h2{font-size:32px;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px}
.hero p{font-size:16px;opacity:0.9;margin-bottom:20px;line-height:1.5}.hero-emoji{position:absolute;right:40px;top:50%;transform:translateY(-50%);font-size:100px;opacity:0.12}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.topic-card{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:16px;cursor:pointer;transition:all .2s}
.topic-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.topic-img{width:100%;height:110px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:12px;background:var(--gray100)}
.topic-name{font-weight:700;font-size:14px;color:var(--gray900);margin-bottom:4px}.topic-desc{font-size:12px;color:var(--gray500);margin-bottom:10px;line-height:1.4;min-height:32px}
.topic-progress-text{font-size:12px;font-weight:600;color:var(--gray600);margin-bottom:4px;display:flex;justify-content:space-between}
.stat-card{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:20px;text-align:center}
.stat-icon{font-size:28px;margin-bottom:6px}.stat-value{font-size:28px;font-weight:800}.stat-label{font-size:12px;color:var(--gray500);font-weight:500}
.activity-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray100)}
.activity-item:last-child{border-bottom:none}.activity-icon{width:36px;height:36px;border-radius:10px;background:var(--g50);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-text{flex:1;min-width:0}.activity-title{font-size:13.5px;color:var(--gray800);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-date{font-size:11px;color:var(--gray400)}
.activity-xp{color:var(--g600);font-weight:700;font-size:13px;flex-shrink:0}
.challenge-box{background:var(--g50);border-radius:14px;padding:18px;border:1px solid var(--g200)}
.challenge-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}.challenge-emoji{font-size:36px}
.challenge-title{font-weight:700;color:var(--g800);font-size:15px}.challenge-desc{font-size:13px;color:var(--g700);margin-bottom:12px}
.achieve-card{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:20px;text-align:center;transition:all .2s}
.achieve-card.locked{opacity:0.45;filter:grayscale(1)}
.achieve-emoji{font-size:44px;margin-bottom:10px}.achieve-name{font-weight:700;font-size:14px;margin-bottom:4px}
.achieve-desc{font-size:12px;color:var(--gray500);margin-bottom:10px;line-height:1.4}
.lesson-list{display:flex;flex-direction:column;gap:10px}.lesson-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--gray200);background:#fff;transition:all .2s;cursor:pointer}
.lesson-item:hover{border-color:var(--g400);background:var(--g50)}.lesson-num{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.lesson-info{flex:1;min-width:0}.lesson-title{font-weight:600;font-size:14.5px}.lesson-preview{font-size:12.5px;color:var(--gray500);margin-top:2px;line-height:1.4}
.lesson-content{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:28px;line-height:1.8;font-size:15px;color:var(--gray700)}
.lesson-content h3{color:var(--g800);font-size:20px;margin-bottom:16px}.lesson-content p{margin-bottom:14px}.lesson-content ul{margin-left:20px;margin-bottom:14px}.lesson-content li{margin-bottom:6px}
.quiz-container{max-width:700px;margin:0 auto}.quiz-question{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:24px;margin-bottom:16px}
.quiz-qnum{font-size:12px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.quiz-text{font-size:18px;font-weight:700;margin-bottom:20px;line-height:1.4}
.quiz-option{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--gray200);background:#fff;margin-bottom:10px;text-align:left;font-size:15px;transition:all .15s;display:flex;align-items:center;gap:12px}
.quiz-option:hover{border-color:var(--g400);background:var(--g50)}.quiz-option.correct{border-color:var(--g500);background:var(--g50)}.quiz-option.wrong{border-color:var(--r500);background:#fef2f2}
.quiz-opt-letter{width:28px;height:28px;border-radius:50%;background:var(--gray100);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--gray600);flex-shrink:0}
.quiz-result{text-align:center;padding:40px 20px}.quiz-result-emoji{font-size:64px;margin-bottom:16px}
.quiz-result h2{font-size:26px;font-weight:800;margin-bottom:8px}.quiz-result p{color:var(--gray500);margin-bottom:20px}
.fc-container{perspective:1200px;width:100%;max-width:480px;height:250px;margin:0 auto}
.fc-card{position:relative;width:100%;height:100%;transition:transform .35s cubic-bezier(0.4,0,0.2,1);transform-style:preserve-3d;cursor:pointer;will-change:transform}
.fc-card.flipped{transform:rotateY(180deg)}.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid var(--gray200);background:#fff}
.fc-back{transform:rotateY(180deg);background:var(--g50);border-color:var(--g300)}.fc-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.fc-front .fc-label{color:var(--gray400)}.fc-back .fc-label{color:var(--g600)}.fc-text{font-size:20px;font-weight:700;line-height:1.4}
.fc-back .fc-text{color:var(--g800)}.fc-hint{font-size:13px;color:var(--gray400);margin-top:16px}
.fc-controls{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px}
.fc-btn{padding:10px 20px;border-radius:10px;background:var(--gray100);font-weight:600;font-size:14px;color:var(--gray700)}.fc-btn:hover{background:var(--gray200)}
.fc-counter{font-size:14px;font-weight:600;color:var(--gray500);min-width:60px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-day-header{text-align:center;padding:10px 4px;font-size:12px;font-weight:700;color:var(--gray400)}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13.5px;color:var(--gray700)}
.cal-day.today{background:var(--g600);color:#fff;font-weight:700}.cal-day.event{box-shadow:inset 0 -4px 0 var(--g400)}
.cal-event-list{margin-top:20px;padding-top:16px;border-top:1px solid var(--gray200)}
.cal-event-item{display:flex;align-items:center;gap:10px;padding:8px 0}
.cal-event-dot{width:8px;height:8px;background:var(--g500);border-radius:50%;flex-shrink:0}.cal-event-text{font-size:13.5px;color:var(--gray700)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:20px;padding:28px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.xp-popup{position:fixed;top:24px;right:24px;background:var(--g600);color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;font-size:15px;z-index:200;animation:xpIn .4s ease,xpOut .4s ease 2.2s forwards;box-shadow:0 8px 30px rgba(22,163,74,0.35);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 48px)}
.xp-popup.levelup{background:linear-gradient(135deg,var(--g600),var(--t600));font-size:17px;padding:16px 26px}
@keyframes xpIn{from{transform:translateX(120px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes xpOut{from{transform:translateX(0);opacity:1}to{transform:translateX(120px);opacity:0}}
.exam-timer{display:inline-flex;align-items:center;gap:6px;background:var(--gray100);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray700)}
.exam-timer.warning{background:#fef3c7;color:#b45309}.exam-timer.danger{background:#fee2e2;color:var(--r600);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.home-fab{position:fixed;right:22px;bottom:22px;z-index:150;background:var(--g600);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(22,163,74,.4);display:flex;align-items:center;gap:6px;transition:all .2s}
.home-fab:hover{background:var(--g700);transform:translateY(-2px)}
.game-card{background:#fff;border-radius:16px;border:1px solid var(--gray200);padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.game-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.08);border-color:var(--g300)}
.game-emoji{font-size:40px;margin-bottom:10px}.game-title{font-weight:700;font-size:14px;margin-bottom:4px}.game-desc{font-size:12px;color:var(--gray500);line-height:1.4}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:0 auto}
.memory-card{aspect-ratio:1;border-radius:12px;background:var(--g600);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all .3s;user-select:none;overflow:hidden;border:2px solid transparent;padding:0}
.memory-card:hover{transform:scale(1.04)}.memory-card.flipped{background:#fff;border-color:var(--g300)}.memory-card.matched{background:var(--g100);border-color:var(--g500);animation:matchPop .4s ease}
.memory-card img{width:100%;height:100%;object-fit:cover;border-radius:10px;pointer-events:none}.memory-card.flipped{color:var(--gray800)}
@keyframes matchPop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.dd-zone{min-height:70px;border:2px dashed var(--gray300);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.dd-zone.drag-over{border-color:var(--g500);background:var(--g50)}.dd-item{padding:8px 14px;background:#fff;border:1.5px solid var(--gray300);border-radius:8px;font-size:13px;font-weight:600;cursor:grab;user-select:none}
.dd-item.sel{border-color:var(--g500);background:var(--g100)}
.section-title{font-size:22px;font-weight:800;margin-bottom:6px}.section-subtitle{font-size:14px;color:var(--gray500);margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tab-btn{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--gray100);color:var(--gray600);transition:all .15s;white-space:nowrap}
.tab-btn:hover{background:var(--gray200)}.tab-btn.active{background:var(--g600);color:#fff}
.match-col{display:flex;flex-direction:column;gap:8px}.match-item{padding:10px 14px;border-radius:10px;border:2px solid var(--gray200);background:#fff;font-size:13.5px;cursor:pointer;transition:all .15s;text-align:left}
.match-item.sel{border-color:var(--g500);background:var(--g50)}.match-item.done{border-color:var(--g300);background:var(--g50);opacity:.7;pointer-events:none}
.ws-grid{display:grid;gap:2px;max-width:420px;margin:0 auto;user-select:none}
.ws-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border-radius:6px;background:#fff;border:1px solid var(--gray200);cursor:pointer}
.ws-cell.sel{background:var(--g200)}.ws-cell.found{background:var(--g500);color:#fff}
.hm-word{font-size:26px;font-weight:800;letter-spacing:10px;margin:16px 0;font-family:monospace}
.hm-letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;margin:0 auto}
.hm-letter{width:38px;height:42px;border-radius:8px;background:#fff;border:1.5px solid var(--gray300);font-weight:700;font-size:15px}
.hm-letter:hover{background:var(--g50);border-color:var(--g400)}
.seq-item{padding:12px 16px;border-radius:10px;border:2px solid var(--gray200);background:#fff;margin-bottom:8px;font-size:14px;cursor:pointer;transition:all .15s;text-align:left;width:100%}
.seq-item:hover{border-color:var(--g400)}.seq-item.placed{border-color:var(--g500);background:var(--g50);pointer-events:none}
.seq-slot{min-height:44px;border:2px dashed var(--gray300);border-radius:10px;margin-bottom:8px;display:flex;align-items:center;padding:0 14px;font-size:14px;background:var(--gray50)}
.wheel-wrap{width:260px;height:260px;margin:0 auto;position:relative}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;transition:transform 4s cubic-bezier(0.15,0.9,0.25,1);border:6px solid #fff;box-shadow:0 8px 30px rgba(0,0,0,.15);overflow:hidden}
.wheel-seg{position:absolute;left:50%;top:0;width:50%;height:50%;transform-origin:0 100%;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-weight:700;color:#fff;font-size:12px}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:28px;z-index:2}
.orbit-hud{display:flex;justify-content:space-between;align-items:center;background:var(--g900);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px;font-size:13px}
.orbit-room{background:linear-gradient(160deg,#14532d,#166534);border-radius:16px;padding:24px;color:#fff;margin-bottom:16px}
.orbit-clue{background:rgba(255,255,255,.12);border-radius:12px;padding:14px;margin-top:12px;font-size:14px;line-height:1.6}
.diff-card{border:2px solid var(--gray200);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.diff-card:hover{border-color:var(--g400);transform:translateY(-2px)}

</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ============================================================
// CONFIGURACIÓN DE FIREBASE (opcional - modo nube)
// Para uso público por enlace: ver instrucciones al final de este archivo
// o en la pestaña "Mi Cuenta" de la app. Sin claves funciona en modo local.
// ============================================================
const FIREBASE_CONFIG = { apiKey:"", authDomain:"", projectId:"", storageBucket:"", messagingSenderId:"", appId:"" };

// ======================== BASE DE DATOS ========================
const DB = {
  getUsers(){ return JSON.parse(localStorage.getItem('bioexplora_users')||'[]'); },
  saveUsers(u){ localStorage.setItem('bioexplora_users', JSON.stringify(u)); },
  getSession(){ return localStorage.getItem('bioexplora_session'); },
  setSession(e){ localStorage.setItem('bioexplora_session', e); },
  clearSession(){ localStorage.removeItem('bioexplora_session'); },
  findUser(email){ const e=(email||'').toLowerCase().trim(); return DB.getUsers().find(u=>u.email===e)||null; },
  getUser(){ const e=DB.getSession(); return e?DB.findUser(e):null; },
  saveUser(u){
    u.email=(u.email||'').toLowerCase().trim();
    const users=DB.getUsers(); const i=users.findIndex(x=>x.email===u.email);
    if(i>=0)users[i]=u; else users.push(u);
    DB.saveUsers(users); DB.fbSave(u);
  },
  deleteUser(email){ DB.saveUsers(DB.getUsers().filter(u=>u.email!==email)); },
  userCount(){ return DB.getUsers().length; },
  auth:null, fs:null, firebaseOn:false,
  initFirebase(){
    try{
      if(!FIREBASE_CONFIG.apiKey || typeof firebase==='undefined') return;
      firebase.initializeApp(FIREBASE_CONFIG);
      DB.auth=firebase.auth(); DB.fs=firebase.firestore(); DB.firebaseOn=true;
    }catch(e){ DB.firebaseOn=false; }
  },
  fbSave(u){
    if(!DB.firebaseOn||!DB.auth||!DB.auth.currentUser) return;
    const data=Object.assign({},u); delete data.password;
    DB.fs.collection('users').doc(u.email).set(data,{merge:true}).catch(function(e){});
  },
  getReviews(){
    try{ return JSON.parse(localStorage.getItem('bioexplora_reviews')||'[]'); }catch(e){ return []; }
  },
  saveReviews(list){
    localStorage.setItem('bioexplora_reviews', JSON.stringify(list||[]));
  },
  addReview(r){
    const list=DB.getReviews();
    list.unshift(r);
    // máximo 200 reseñas en el dispositivo
    if(list.length>200) list.length=200;
    DB.saveReviews(list);
    // nube opcional
    if(DB.firebaseOn&&DB.fs){
      try{ DB.fs.collection('reviews').doc(r.id).set(r,{merge:true}).catch(function(){}); }catch(e){}
    }
  },
  deleteReview(id, email){
    const list=DB.getReviews().filter(x=>!(x.id===id && x.email===email));
    DB.saveReviews(list);
  },
  migrateLegacy(){
    const raw=localStorage.getItem('bioexplora_user');
    if(raw){ try{ const old=JSON.parse(raw); if(old&&old.email){ if(!old.password)old.password=''; if(!DB.findUser(old.email))DB.saveUser(old);} }catch(e){}
      localStorage.removeItem('bioexplora_user'); localStorage.removeItem('bioexplora_progress'); localStorage.removeItem('bioexplora_history'); }
  }
};

// ======================== ESTADO GLOBAL ========================
let state = {
  page:'login', tab:'inicio', user:null,
  lessonTopic:'celula', lessonView:null,
  gameTopic:'celula', gameId:null, gameData:null, gameDiff:null, memMode:null, gameCount:null,
  fcDeck:null, fcStudied:{}, fcSessionKey:null, fcTopic:'celula', fcIndex:0, fcFlipped:false, fcDiff:'media',
  examTopic:null, examDiff:null, examIndex:0, examScore:0, examTimer:null, examTimeLeft:0, examQs:[],
  oralTopic:null, oralIndex:0, oralScore:0, oralQs:[], oralListening:false,
  sidebarOpen:false
};

function createUser(name,email,pass){
  const u={ name:name||'Estudiante', email:(email||'').toLowerCase().trim(), password:pass||'',
    level:1, xp:0, maxXp:500, racha:1, points:0, logros:0, gamesPlayed:0,
    completedLessons:[], achievements:JSON.parse(JSON.stringify(CURRICULUM.achievements)),
    history:[], totalQuizCorrect:0, totalFlashcards:0, studyDays:[], examsPassed:0, examsHardPassed:0, perfectExams:0, oralsDone:0, oralsPassed:0, reviewsPosted:0,
    lastLogin:new Date().toDateString(), createdAt:new Date().toISOString() };
  state.user=u; DB.saveUser(u); return u;
}

function showXpPopup(msg,isLevelUp){
  const d=document.createElement('div');
  d.className='xp-popup'+(isLevelUp?' levelup':'');
  d.textContent=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(),2600);
}

function addXp(amount,reason,skipRender){
  if(!state.user) return;
  state.user.xp+=amount; state.user.points+=amount;
  state.user.history.unshift({t:reason,xp:amount,date:new Date().toLocaleDateString('es-ES')});
  if(state.user.history.length>30)state.user.history.pop();
  if(state.user.xp>=state.user.maxXp){
    state.user.level++; state.user.xp-=state.user.maxXp; state.user.maxXp=Math.floor(state.user.maxXp*1.35);
    showXpPopup('🎉 ¡Subiste al Nivel '+state.user.level+'!',true);
  } else showXpPopup('+'+amount+' XP: '+reason);
  checkAchievements(); DB.saveUser(state.user);
  if(!skipRender) render();
}

function mergeAchievements(u){
  if(!u) return;
  const defs = CURRICULUM.achievements||[];
  if(!u.achievements) u.achievements=[];
  defs.forEach(d=>{
    if(!u.achievements.find(a=>a.id===d.id)){
      u.achievements.push(JSON.parse(JSON.stringify(d)));
    }
  });
  u.logros = u.achievements.filter(a=>a.unlocked).length;
}

function checkAchievements(){
  const u=state.user; if(!u) return;
  mergeAchievements(u);
  function unlock(id){
    const a=u.achievements.find(x=>x.id===id);
    if(a&&!a.unlocked){ a.unlocked=true; u.logros=u.achievements.filter(x=>x.unlocked).length; showXpPopup('🏆 Logro: '+a.name); }
  }
  const lessons=u.completedLessons||[];
  if(lessons.length>=1)unlock('first');
  if(lessons.length>=5)unlock('curious');
  if(lessons.length>=15)unlock('scholar');
  if(lessons.length>=25)unlock('bookworm');
  if((u.racha||0)>=3)unlock('streak3');
  if((u.racha||0)>=7)unlock('dedicated');
  if((u.racha||0)>=30)unlock('streak30');
  if((u.level||1)>=5)unlock('level5');
  if((u.level||1)>=10)unlock('master');
  if((u.level||1)>=15)unlock('level15');
  if((u.totalQuizCorrect||0)>=50)unlock('quizzer');
  if((u.totalQuizCorrect||0)>=100)unlock('quiz100');
  if((u.totalFlashcards||0)>=20)unlock('flash');
  if((u.totalFlashcards||0)>=50)unlock('flash50');
  if((u.gamesPlayed||0)>=10)unlock('gamer');
  if((u.gamesPlayed||0)>=50)unlock('gamer50');
  if((u.points||0)>=100)unlock('points100');
  if((u.points||0)>=500)unlock('points500');
  if((u.points||0)>=1000)unlock('points1000');
  // temas salud/ecosistemas
  const topicsDone=new Set(lessons.map(k=>String(k).split(':')[0]));
  if(topicsDone.has('ecosistemas')||topicsDone.has('ecologia'))unlock('eco');
  if(topicsDone.has('salud')||topicsDone.has('atencion'))unlock('medic');
  if(topicsDone.size>=9)unlock('all_topics');
  if((u.studyDays||[]).length>=1)unlock('calendar_plan');
  if((u.oralsDone||0)>=1)unlock('oral_first');
  if((u.oralsPassed||0)>=1)unlock('oral_master');
  if((u.examsPassed||0)>=1)unlock('exam_pass');
  if((u.examsHardPassed||0)>=1)unlock('exam_hard');
  if((u.perfectExams||0)>=1)unlock('perfect');
  if((u.reviewsPosted||0)>=1)unlock('reviewer');
  if(u.achievements.filter(a=>a.unlocked).length>=20)unlock('legend');
}

function markLessonComplete(lessonId,topicId,xp){
  if(!state.user)return;
  const key=topicId+':'+lessonId;
  if(!state.user.completedLessons.includes(key)){
    state.user.completedLessons.push(key);
    addXp(xp,'Lección: '+lessonId);
  }
  DB.saveUser(state.user);
}

function getTopicProgress(topicId){
  const lessons=CURRICULUM.lessons[topicId]||[];
  if(!state.user||!lessons.length)return 0;
  const done=lessons.filter(l=>state.user.completedLessons.includes(topicId+':'+l.id)).length;
  return Math.round(done/lessons.length*100);
}

function updateStreak(){
  const u=state.user; if(!u)return;
  const today=new Date().toDateString();
  if(u.lastLogin===today)return;
  const y=new Date(Date.now()-86400000).toDateString();
  u.racha=(u.lastLogin===y)?(u.racha||1)+1:1;
  u.lastLogin=today; DB.saveUser(u);
}

function updateUserCount(){
  const el=document.getElementById('user-count'); if(!el)return;
  const n=DB.userCount();
  el.textContent=n>0?'👥 '+n+' explorador'+(n>1?'es':'')+' registrado'+(n>1?'s':'')+' en este dispositivo':'';
  const cs=document.getElementById('cloud-status'); if(!cs)return;
  cs.textContent=DB.firebaseOn?'☁️ Modo nube: progreso guardado en internet':'💾 Modo local: datos en este dispositivo';
}

async function resetPassword(){
  const email=(document.getElementById('lemail').value||'').trim().toLowerCase();
  if(!email){alert('Escribe tu correo arriba primero.');return;}
  if(!DB.firebaseOn){alert('Modo local: pide al docente que reinicie tu contraseña desde su panel o borra la cuenta y regístrate de nuevo.');return;}
  try{ await DB.auth.sendPasswordResetEmail(email); alert('📧 Correo de recuperación enviado.'); }
  catch(e){ alert('No se pudo enviar: '+e.message); }
}

// ======================== CONTENIDO CURRICULAR ========================
const CURRICULUM = {"topics": [{"id": "celula", "name": "La Célula", "icon": "🧬", "color": "#16a34a", "colorLight": "#dcfce7", "desc": "Estructura y función de la célula eucariota"}, {"id": "genetica", "name": "Genética y Herencia", "icon": "🧪", "color": "#2563eb", "colorLight": "#dbeafe", "desc": "Mendel, alteraciones genéticas y biotecnología"}, {"id": "circulatorio", "name": "Sistema Circulatorio", "icon": "❤️", "color": "#dc2626", "colorLight": "#fee2e2", "desc": "Corazón, circulación y salud cardiovascular"}, {"id": "salud", "name": "Salud y Enfermedad", "icon": "🦠", "color": "#7c3aed", "colorLight": "#ede9fe", "desc": "Transmisibles y no transmisibles: prevención (unificado)"}, {"id": "atencion", "name": "Atención a la Salud", "icon": "🩹", "color": "#f59e0b", "colorLight": "#fef3c7", "desc": "Primeros auxilios, emergencias y medicina tradicional"}, {"id": "reino", "name": "Reino Animal", "icon": "🦙", "color": "#0d9488", "colorLight": "#ccfbf1", "desc": "Invertebrados, vertebrados y taxonomía"}, {"id": "ecologia", "name": "Niveles y Ecología", "icon": "🌿", "color": "#15803d", "colorLight": "#dcfce7", "desc": "Organización ecológica y ecología de poblaciones (unificado)"}, {"id": "ecosistemas", "name": "Ecosistemas y Leyes", "icon": "🌍", "color": "#65a30d", "colorLight": "#ecfccb", "desc": "Gestión ambiental y legislación boliviana"}, {"id": "biodiversidad", "name": "Bolivia Biodiversidad", "icon": "🇧🇴", "color": "#b45309", "colorLight": "#fef3c7", "desc": "Áreas protegidas, especies y el felino tilcayo"}], "lessons": {"celula": [{"id": "c1", "title": "Estructura de la célula eucariota", "xp": 50, "content": "<h3>🔬 La Célula: Unidad de la Vida</h3><p>La célula es la unidad estructural y funcional de todos los seres vivos. Robert Hooke (1665) fue el primero en observarla. Existen dos tipos: <strong>procariota</strong> (sin núcleo definido, como las bacterias) y <strong>eucariota</strong> (con núcleo verdadero: animales, plantas, hongos, protistas).</p><p>La célula eucariota animal tiene membrana plasmática, citoplasma, núcleo y orgánulos: mitocondrias, retículo endoplásmico, aparato de Golgi, lisosomas y peroxisomas.</p><p>En Bolivia, el estudio de la biodiversidad celular en la Amazonía y el Altiplano permite comprender la adaptación de especies nativas a condiciones extremas.</p>"}, {"id": "c2", "title": "La membrana plasmática", "xp": 50, "content": "<h3>🛡️ Membrana Plasmática</h3><p>Es una estructura selectivamente permeable que rodea la célula. Según el modelo de Singer y Nicolson (1972) está compuesta por:</p><ul><li><strong>Bicapa lipídica:</strong> fosfolípidos con cabeza hidrofílica y colas hidrofóbicas</li><li><strong>Proteínas integrales:</strong> canales y transportadores</li><li><strong>Proteínas periféricas</strong> y <strong>carbohidratos</strong> (reconocimiento celular)</li></ul><p><strong>Funciones:</strong> protección, transporte selectivo, comunicación celular y reconocimiento.</p>"}, {"id": "c3", "title": "El núcleo celular", "xp": 50, "content": "<h3>🧬 El Núcleo: Centro de Control</h3><p>Es el orgánulo más grande y contiene el ADN. Sus componentes:</p><ul><li><strong>Envoltura nuclear</strong> con poros nucleares</li><li><strong>Cromatina</strong> (ADN + histonas) y <strong>cromosomas</strong> (forma condensada)</li><li><strong>Nucléolo:</strong> síntesis de ARN ribosómico</li></ul><p>El ser humano tiene 46 cromosomas (23 pares). El par 23 determina el sexo: XX (mujer) o XY (hombre).</p>"}, {"id": "c4", "title": "Mitocondrias y cloroplastos", "xp": 60, "content": "<h3>⚡ Mitocondrias y 🌿 Cloroplastos</h3><p><strong>Mitocondrias:</strong> doble membrana; respiración celular y producción de ATP. Tienen su propio ADN (teoría endosimbiótica de Lynn Margulis).</p><p><strong>Cloroplastos:</strong> solo en células vegetales; contienen clorofila y realizan la fotosíntesis: 6CO₂ + 6H₂O + luz → C₆H₁₂O₆ + 6O₂</p><p>La teoría endosimbiótica propone que ambos fueron bacterias independientes fagocitadas por células ancestrales.</p>"}], "genetica": [{"id": "g1", "title": "Leyes de Mendel", "xp": 60, "content": "<h3>🌱 Gregor Mendel y la Herencia</h3><p>Mendel (1822-1884), monje agustino, experimentó con chícharos (Pisum sativum) y fundó la genética.</p><p><strong>Primera Ley (Uniformidad):</strong> al cruzar dos razas puras, toda la F1 es idéntica (ej. conejo NN × coneja nn → todos Nn negros).</p><p><strong>Segunda Ley (Segregación):</strong> al cruzar los híbridos F1, los alelos se separan: 3 negros : 1 blanco; genotipos 1 NN : 2 Nn : 1 nn.</p><p><strong>Tercera Ley (Herencia independiente):</strong> los caracteres no antagónicos se heredan independientemente (ej. ratones: 9/16 negro corto, 3/16 negro largo, 3/16 blanco corto, 1/16 blanco largo).</p>"}, {"id": "g2", "title": "Nomenclatura genética", "xp": 60, "content": "<h3>🧬 Conceptos Fundamentales</h3><ul><li><strong>Genotipo:</strong> constitución genética (AA, Aa, aa)</li><li><strong>Fenotipo:</strong> expresión observable</li><li><strong>Alelo:</strong> variante de un gen (A dominante, a recesivo)</li><li><strong>Homocigoto:</strong> dos alelos iguales / <strong>Heterocigoto:</strong> diferentes</li><li><strong>Monohíbrido:</strong> híbrido para un rasgo (Aa) / <strong>Dihíbrido:</strong> AaBb</li><li><strong>Locus:</strong> posición del gen en el cromosoma / <strong>Genoma:</strong> ADN completo</li></ul><p><strong>Cuadro de Punnett:</strong> herramienta para predecir proporciones genotípicas y fenotípicas.</p>"}, {"id": "g3", "title": "Herencia ligada al sexo", "xp": 60, "content": "<h3>⚧ Herencia Ligada al Sexo</h3><p>Mujeres 44XX y hombres 44XY. Algunos genes están en el cromosoma X:</p><p><strong>Daltonismo:</strong> no distinguir rojo y verde. XdY = hombre enfermo; XDXd = mujer portadora.</p><p><strong>Hemofilia:</strong> sangre que no coagula. XhY = enfermo; las mujeres XhXh generalmente no nacen. En Bolivia hay ~150 pacientes registrados y la <strong>Ley 754</strong> garantiza dotación gratuita de Factor VIII y IX.</p>"}, {"id": "g4", "title": "Alteraciones y mutaciones", "xp": 70, "content": "<h3>🔄 Alteraciones Genéticas</h3><p><strong>Tipos de mutación:</strong> cromosómica (afecta la estructura), génica (afecta un gen) y genómica (todo el genoma).</p><p><strong>Alteraciones estructurales:</strong> deleción, duplicación, inversión, translocación.</p><p><strong>Aneuploidías:</strong> Down (trisomía 21, 1/800 nacidos), Edwards (18), Patau (13), Turner (X0), Klinefelter (XXY).</p><p><strong>Factores externos:</strong> tabaco, radiación solar, alcohol, drogas. Herramientas de diagnóstico: cariotipo y amniocentesis.</p>"}, {"id": "g5", "title": "Ingeniería genética y biotecnología", "xp": 70, "content": "<h3>🔧 Ingeniería Genética y Biotecnología</h3><p><strong>Ingeniería genética:</strong> manipulación deliberada del ADN para introducir rasgos. <strong>Biotecnología:</strong> uso de seres vivos para productos y procesos.</p><p><strong>Recombinación del ADN:</strong> mezcla de material genético. En reproducción sexual ocurre el entrecruzamiento (crossing-over) en la meiosis; la recombinación artificial usa plásmidos y vectores.</p><p><strong>Colores de la biotecnología:</strong> verde (agrícola), roja (salud y vacunas), amarilla (alimentos), azul (marina), blanca (industrial/eco), dorada (informática genética), púrpura (legal), negra (bioseguridad), marrón (bienestar animal), naranja (divulgación).</p><p><strong>OGM y transgénicos:</strong> Bolivia los autoriza desde 1992 (papa transgénica Desireé); el Comité Nacional de Bioseguridad los regula desde 1997.</p>"}], "circulatorio": [{"id": "r1", "title": "Anatomía del corazón", "xp": 55, "content": "<h3>❤️ El Corazón: Bomba de la Vida</h3><p>Órgano muscular del tamaño de un puño, con cuatro cámaras:</p><ul><li><strong>Aurícula derecha:</strong> recibe sangre desoxigenada de la vena cava</li><li><strong>Ventrículo derecho:</strong> bombea a los pulmones (arteria pulmonar)</li><li><strong>Aurícula izquierda:</strong> recibe sangre oxigenada de las venas pulmonares</li><li><strong>Ventrículo izquierdo:</strong> bombea al cuerpo (aorta)</li></ul><p><strong>Válvulas:</strong> mitral, tricúspide, aórtica y pulmonar. Late ~100.000 veces al día, bombeando ~7.500 litros.</p>"}, {"id": "r2", "title": "Circulación sistémica y pulmonar", "xp": 55, "content": "<h3>🔄 Doble Circulación</h3><p><strong>Pulmonar (pequeña):</strong> ventrículo derecho → arteria pulmonar → pulmones → venas pulmonares → aurícula izquierda.</p><p><strong>Sistémica (grande):</strong> ventrículo izquierdo → aorta → arterias → capilares → venas → vena cava → aurícula derecha.</p><p><strong>Sistema linfático:</strong> drena líquido intersticial, transporta linfocitos y absorbe grasas.</p>"}, {"id": "r3", "title": "Presión arterial y salud", "xp": 55, "content": "<h3>🩺 Presión Arterial y Factores de Riesgo</h3><p>Presión normal: <strong>120/80 mmHg</strong>. Hipertensión etapa 1: 130-139/80-89; etapa 2: ≥140/≥90.</p><p><strong>Factores de riesgo en Bolivia:</strong> dieta alta en sal (chuño, charque), sedentarismo, estrés, obesidad, alcohol y tabaco. El Ministerio de Salud promueve la detección temprana en centros de salud.</p><p><strong>Prevención:</strong> 150 minutos de actividad física semanal, reducir sodio, control médico anual.</p>"}], "salud": [{"id": "s1", "title": "Salud, enfermedad y noxas", "xp": 50, "content": "<h3>⚖️ Salud y Enfermedad</h3><p><strong>Salud (OMS):</strong> estado de bienestar completo físico, mental y social, no solo ausencia de enfermedad. <strong>Enfermedad:</strong> alteración de la salud.</p><p><strong>Noxa:</strong> factor que altera la homeostasis. Puede ser biológica (virus, bacterias, parásitos), física (ruido, calor) o psíquica/social/cultural.</p><p><strong>Clasificación por duración:</strong> agudas (<3 meses), subagudas (3-6), crónicas (>6 meses). Por origen: infecciosas, hereditarias, autoinmunes, neurodegenerativas, metabólicas.</p>"}, {"id": "s2", "title": "Enfermedades transmisibles", "xp": 60, "content": "<h3>🦠 Transmisibles: bacterias, virus y vectores</h3><p><strong>Por bacterias:</strong> cólera (vibrión cholerae, agua contaminada), coqueluche, salmonelosis, tuberculosis (mycobacterium), difteria, tétanos (clostridium, heridas).</p><p><strong>Por virus:</strong> COVID-19 (SARS-CoV-2), influenza, VIH/SIDA (ataque a glóbulos blancos), VPH, viruela símica.</p><p><strong>Por vectores:</strong> dengue, zika y chikungunya (Aedes aegypti), hantavirus (roedores). En Bolivia el dengue es endémico en zonas tropicales y la tuberculosis es prioridad nacional.</p><p><strong>Transmisión:</strong> directa (contacto, gotículas, sexual, vertical) e indirecta (vectores, fómites, agua y alimentos).</p>"}, {"id": "s3", "title": "Enfermedades no transmisibles (ENT)", "xp": 60, "content": "<h3>🫀 ENT: la epidemia silenciosa</h3><p>Matan 41 millones de personas al año (71% de muertes mundiales). Las 4 principales: <strong>cardiovasculares</strong> (17,9 M), <strong>cáncer</strong> (9 M), <strong>respiratorias crónicas</strong> (3,9 M) y <strong>diabetes</strong> (1,6 M).</p><p><strong>Características:</strong> no se contagian, suelen ser crónicas, se asocian a estilo de vida y genética, aumentan con la edad.</p><p><strong>Otras ENT:</strong> Alzheimer (demencia, 21 de septiembre Día Mundial), asma, EPOC, trastornos mentales (ansiedad, depresión), lesiones externas.</p><p>En Bolivia, el 22% de escolares tiene sobrepeso y 11% obesidad (estudio UMSA/UNICEF 2020).</p>"}, {"id": "s4", "title": "Factores de riesgo y prevención", "xp": 60, "content": "<h3>🛡️ Factores de Riesgo y Prevención</h3><p><strong>Comportamentales (modificables):</strong> tabaco, inactividad física, dieta malsana, alcohol.</p><p><strong>Metabólicos:</strong> hipertensión (≥140/90), sobrepeso/obesidad, hiperglucemia, hiperlipidemia.</p><p><strong>Prevención:</strong> 150 min de ejercicio semanal, 5 porciones de frutas y verduras al día, limitar bebidas azucaradas y ultraprocesados, no fumar, control médico anual.</p><p><strong>Resistencia a los antimicrobianos (RAM):</strong> los microorganismos resisten los medicamentos por uso inadecuado. Prevenir: usar antibióticos solo con receta y completar el tratamiento.</p>"}, {"id": "s5", "title": "Higiene e inocuidad alimentaria", "xp": 50, "content": "<h3>🧼 Higiene e Inocuidad</h3><p>El lavado de manos correcto (mínimo 20 segundos) reduce 50% las diarreas infantiles y 25% las infecciones respiratorias. Lavar: antes de comer, después del baño, al llegar a casa y tras toser.</p><p><strong>Inocuidad (5 claves OMS):</strong> 1) Mantén limpio, 2) Agua y alimentos seguros, 3) Temperaturas seguras, 4) Separa crudos de cocidos, 5) Cocina completamente.</p><p><strong>Técnicas ancestrales bolivianas:</strong> qollqas (silos de barro), chuño (papa congelada y deshidratada) y charque (carne deshidratada) que conservaban alimentos por años.</p>"}], "atencion": [{"id": "a1", "title": "Botiquín de primeros auxilios", "xp": 50, "content": "<h3>🧰 El Botiquín</h3><p>Conjunto básico de suministros para atender lesiones menores antes de la atención profesional. Debe estar en lugar fresco, seco y accesible (fuera del alcance de niños pequeños).</p><p><strong>Elementos:</strong> analgésicos (paracetamol, ibuprofeno), tijeras de punta redonda, alcohol antiséptico, vendajes adhesivos y elásticos, gasas estériles, crema para quemaduras, material de inmovilización.</p><p>En la escuela: armar un botiquín escolar es una producción comunitaria (caja blanca con cruz roja, visible para todos).</p>"}, {"id": "a2", "title": "PAS: Proteger, Avisar, Socorrer", "xp": 60, "content": "<h3>🚨 Regla PAS</h3><p><strong>Proteger:</strong> evaluar el entorno para no crear más víctimas. <strong>Avisar:</strong> llamar a los servicios de emergencia. <strong>Socorrer:</strong> atender a la víctima.</p><p><strong>Números de emergencia Bolivia:</strong> 110 Policía, 119 Bomberos, 120 PAC, 123 SAR-Bomberos Búsqueda y Rescate, 114 Retén de emergencias (La Paz).</p><p><strong>Signos vitales:</strong> conciencia, respiración, pulso, reflejo pupilar, temperatura, presión arterial. <strong>RCP</strong> si hay paro cardíaco; <strong>posición lateral de seguridad</strong> si está inconsciente pero respira.</p>"}, {"id": "a3", "title": "Heridas, quemaduras y lipotimia", "xp": 60, "content": "<h3>🩹 Tratamiento inicial</h3><p><strong>Heridas:</strong> lavar manos, detener sangrado con presión directa 5-10 min, limpiar con solución salina, cubrir con apósito. NUNCA torniquetes, sacar objetos clavados o soplar la herida.</p><p><strong>Quemaduras:</strong> 1er grado (enrojecimiento): compresas frías y crema; 2do (ampollas): agua abundante, NO reventar ampollas; 3er grado (profundas): atención médica urgente.</p><p><strong>Lipotimia/síncope:</strong> tumbar a la persona, elevar las piernas, aflojar ropa ajustada, ventilar. Si no respira: iniciar RCP.</p>"}, {"id": "a4", "title": "Asfixia, traumatismos y fracturas", "xp": 60, "content": "<h3>🆘 Otras emergencias</h3><p><strong>Atragantamiento:</strong> 5 golpes en la espalda + maniobra de Heimlich (puño sobre el ombligo, empujar hacia arriba y adentro). En bebés: 5 golpes en espalda y 5 compresiones torácicas.</p><p><strong>Traumatismo:</strong> localizar el golpe, aplicar hielo envuelto en paño (evita quemadura por frío).</p><p><strong>Fracturas:</strong> NO mover el miembro ni intentar reacomodarlo; inmovilizar las dos articulaciones vecinas con férula y traslado médico urgente.</p><p><strong>SOAT:</strong> seguro obligatorio que cubre gastos médicos de accidentes de tránsito hasta Bs 24.000. La Ley 3988 obliga a socorrer a víctimas de accidentes.</p>"}, {"id": "a5", "title": "Medicina tradicional boliviana", "xp": 60, "content": "<h3>🌿 Medicina Tradicional (Ley 459)</h3><p>Bolivia reconoce la medicina tradicional de los 36 pueblos indígenas en igualdad de condiciones con la medicina farmacológica.</p><p><strong>¿Quiénes la practican?</strong> Médicas y médicos tradicionales ancestrales, yatiris, curanderos e <strong>Ipayes</strong> (guaraníes del Chaco), y <strong>naturistas</strong> con amplio conocimiento de plantas.</p><p><strong>Medicina natural:</strong> homeopatía, acupuntura, terapia floral. <strong>Curaciones caseras:</strong> té de miel y limón para la garganta, aloe vera en quemaduras, compresas frías para fiebre.</p><p>⚠️ La automedicación es un riesgo: siempre orientación profesional.</p>"}], "reino": [{"id": "an1", "title": "Invertebrados", "xp": 55, "content": "<h3>🐌 Reino Animalia: Invertebrados</h3><p>Animales sin columna vertebral, en su mayoría ovíparos.</p><ul><li><strong>Poríferos (esponjas):</strong> sésiles, filtran agua con poros</li><li><strong>Cnidarios:</strong> medusas, anémonas, corales; tentáculos con células urticantes</li><li><strong>Platelmintos:</strong> gusanos planos, muchos parásitos (tenia, hasta 4 m)</li><li><strong>Anélidos:</strong> gusanos segmentados (lombriz, sanguijuela)</li><li><strong>Moluscos:</strong> cuerpo blando, concha, pie muscular (caracoles, mejillones)</li><li><strong>Equinodermos:</strong> simetría pentarradial (estrellas de mar, erizos)</li><li><strong>Artrópodos:</strong> +1 millón de especies; insectos, arácnidos, crustáceos, miriápodos</li></ul>"}, {"id": "an2", "title": "Vertebrados: peces, anfibios y reptiles", "xp": 55, "content": "<h3>🐟 Vertebrados (I)</h3><p>Tienen columna vertebral, cerebro protegido y mandíbula.</p><p><strong>Peces:</strong> ectotermos acuáticos; respiran por branquias; aletas; circulación cerrada de un solo circuito; reproducción por desove.</p><p><strong>Anfibios:</strong> metamorfosis (renacuajo → adulto); anuros (sin cola), caudados (con cola), gimnofionos; piel húmeda; primeros tetrápodos.</p><p><strong>Reptiles:</strong> piel con escamas de queratina; pulmones (algunas serpientes tienen uno); tortugas, lagartos, serpientes, cocodrilos; fecundación interna.</p>"}, {"id": "an3", "title": "Aves y mamíferos", "xp": 55, "content": "<h3>🦅 Vertebrados (II)</h3><p><strong>Aves:</strong> endotermas, huesos huecos, sacos aéreos, plumas de queratina, pico sin dientes; buche y molleja; doble circulación muy eficiente; ovíparas con rituales de apareamiento.</p><p><strong>Mamíferos:</strong> sangre caliente, pelo y glándulas mamarias. Órdenes: monotremas (ovíparos: ornitorrinco), marsupiales (bolsa), insectívoros, carnívoros, quiropteros (murciélagos), roedores, primates... placenta en la mayoría.</p>"}, {"id": "an4", "title": "Animales en peligro en Bolivia", "xp": 65, "content": "<h3>⚠️ Especies amenazadas de Bolivia</h3><p>Causas: caza ilegal, sobrepesca, deforestación, cambio climático y tráfico.</p><ul><li><strong>Jaguar</strong> (Panthera onca) — En Peligro; Madidi, Kaa-Iya, Noel Kempff</li><li><strong>Oso de anteojos</strong> (Tremarctos ornatus) — Andes y Yungas</li><li><strong>Nutria gigante</strong> y <strong>delfín de río boliviano</strong> (Inia boliviensis, endémico)</li><li><strong>Gato andino</strong> (Leopardus jacobita) — Altiplano</li><li><strong>Paraba barba azul</strong> (Ara glaucogularis) y <strong>frente roja</strong> — Críticas; endémicas del Beni</li><li><strong>Rana gigante del Titicaca</strong> (Telmatobius culeus) — Crítica</li><li><strong>Cóndor andino</strong> (Vultur gryphus)</li><li>Robal, sapo arlequín tricolor, jaranko (La Paz), falso murciélago vampiro</li></ul>"}, {"id": "an5", "title": "Taxonomía y sistema binomial", "xp": 60, "content": "<h3>📋 Taxonomía: el inventario de la vida</h3><p>La <strong>taxonomía</strong> estudia el parentesco y la historia evolutiva. <strong>Carl Linneo</strong> (1707-1778), padre de la taxonomía, creó la <strong>nomenclatura binomial</strong>: género (mayúscula) + epíteto (minúscula), en latín y cursiva. Ej: <em>Homo sapiens</em>, <em>Vulpes vulpes</em>.</p><p><strong>Categorías jerárquicas:</strong> Dominio → Reino → Filo/División → Clase → Orden → Familia → Género → Especie. A más categorías compartidas, más cercano el parentesco (apoyo de Darwin: ancestro común).</p><p><strong>Caracteres taxonómicos:</strong> morfológicos, fisiológicos, citológicos y bioquímicos/moleculares.</p>"}], "ecologia": [{"id": "e1", "title": "Niveles de organización ecológica", "xp": 60, "content": "<h3>🌿 De la biosfera al individuo</h3><p><strong>Niveles:</strong> individuo → población (individuos de una especie) → comunidad (varias especies) → ecosistema (comunidad + medio físico) → bioma → <strong>biosfera</strong> (zona de la Tierra con vida, de 10.000 m de altura al fondo del océano).</p><p><strong>Ecosistema</strong> = biocenosis (seres vivos) + biotopo (lugar y clima). <strong>Hábitat:</strong> lugar con condiciones adecuadas; <strong>nicho ecológico:</strong> función del organismo (abeja: polinizadora; hongos: descomponedores).</p>"}, {"id": "e2", "title": "Funciones en el ecosistema y flujo de energía", "xp": 60, "content": "<h3>⚡ Productores, consumidores y descomponedores</h3><p><strong>Productores (autótrofos):</strong> plantas y algas que hacen fotosíntesis. <strong>Consumidores (heterótrofos):</strong> primarios/herbívoros, secundarios, terciarios y cuaternarios. <strong>Descomponedores:</strong> bacterias y hongos que reciclan nutrientes; detritívoros y carroñeros.</p><p><strong>Flujo de energía:</strong> del Sol a productores y en cadena; en cada nivel trófico solo se aprovecha ~10% (resto se pierde como calor) → pirámides de energía.</p><p><strong>Ciclos biogeoquímicos:</strong> carbono (fotosíntesis), oxígeno (Gran Oxidación por cianobacterias hace 2.400 M de años), nitrógeno (fijación) y agua.</p>"}, {"id": "e3", "title": "Relaciones ecológicas", "xp": 60, "content": "<h3>🤝 Intraespecíficas e interespecíficas</h3><p><strong>Intraespecíficas:</strong> entre organismos de la misma especie (cooperación social, familiar, colonial, gregaria; o competencia por alimento/territorio).</p><p><strong>Interespecíficas:</strong> <strong>mutualismo</strong> (ambos ganan: liquen, oruga-hormiga), <strong>comensalismo</strong> (uno gana, otro no se afecta: caracara y vaca), <strong>amensalismo</strong> (uno se daña: penicillium y bacteria) y <strong>depredación</strong>.</p><p><strong>Defensas ante depredadores:</strong> camuflaje, aposematismo (colores de advertencia), mimetismo batesiano (inofensiva imita a peligrosa) y mimetismo mülleriano (varias peligrosas se parecen).</p><p><strong>Cooperación:</strong> exozoocoria y endozoocoria (dispersión de semillas por animales).</p>"}, {"id": "e4", "title": "Ecología de poblaciones", "xp": 65, "content": "<h3>📊 Dinámica poblacional</h3><p>Variables: <strong>población</strong> (total de individuos), <strong>densidad ecológica</strong> (individuos por área), <strong>tasa de natalidad/fertilidad</strong>, <strong>tasa de mortalidad</strong>, <strong>inmigración</strong> y <strong>emigración</strong>. El balance de todas da la <strong>tasa de crecimiento poblacional</strong>.</p><p><strong>Factores limitantes (Ley del Mínimo):</strong> en terrestres el agua, la temperatura y nutrientes; en acuáticos la luz, nutrientes y oxígeno.</p><p>Ejemplo boliviano: la <strong>liebre europea</strong> introducida entre los años 40-50 compite con especies endógenas y daña cultivos de quinua.</p>"}, {"id": "e5", "title": "Sucesiones y conservación", "xp": 65, "content": "<h3>🌳 Sucesión ecológica y biodiversidad</h3><p><strong>Sucesión ecológica:</strong> cambios del ecosistema en el tiempo. <strong>Primaria:</strong> sobre terreno yermo (roca, isla volcánica). <strong>Secundaria:</strong> sobre suelo previamente ocupado (campo abandonado, bosque quemado).</p><p>Comienzan con <strong>especies pioneras</strong> (fotosintéticas); la sucesión culmina en un ecosistema estable: <strong>clímax</strong>. Si la biodiversidad disminuye, ocurre <strong>regresión</strong>.</p><p><strong>Biodiversidad:</strong> diversidad de ecosistemas, especies y genes. Amenazas: contaminación, deforestación, fragmentación de hábitats. Medida clave: <strong>espacios protegidos</strong> (seguir rutas, no recolectar, no fuego ni basura).</p>"}], "ecosistemas": [{"id": "ec1", "title": "Componentes y ecosistemas de Bolivia", "xp": 70, "content": "<h3>🌍 Ecosistemas bolivianos</h3><p>Un ecosistema es un sistema de organismos vivos y medio ambiente con flujos de energía y ciclos de materia.</p><p><strong>Abióticos:</strong> agua, luz, temperatura, suelo, aire. <strong>Bióticos:</strong> productores, consumidores y descomponedores.</p><p><strong>Bolivia tiene 7 ecosistemas:</strong> Amazonía (bosque tropical), Yungas (bosque nublado), Altiplano (puna), Chaco (bosque seco), Chiquitania (bosque caducifolio), Pantanal (humedal) y Tucavaca (cerrado).</p>"}, {"id": "ec2", "title": "Leyes ambientales bolivianas", "xp": 70, "content": "<h3>⚖️ Marco Legal Ambiental</h3><p><strong>Ley 1333 (1992):</strong> Ley del Medio Ambiente; crea el SIREGMA. Principios: precaución, prevención, desarrollo sostenible, participación.</p><p><strong>Ley 071 (2010):</strong> Derechos de la Madre Tierra: la reconoce como ser vivo con derechos (vida, diversidad, agua, recuperación, vivir sin contaminación).</p><p><strong>Ley 300 (2012):</strong> desarrollo integral para el Vivir Bien (Suma Qamaña). <strong>Constitución 2009:</strong> arts. 33-34.</p>"}, {"id": "ec3", "title": "Cambio climático en Bolivia", "xp": 70, "content": "<h3>🌡️ Bolivia vulnerable al clima</h3><ul><li><strong>Glaciares:</strong> el Chacaltaya perdió su glaciar en 2009; Illimani y Huayna Potosí perdieron más del 40% de su masa</li><li><strong>Sequías en el Altiplano:</strong> afectan quinoa, papa y acceso al agua de comunidades</li><li><strong>Amazonía:</strong> lluvias irregulares afectan biodiversidad y agricultura</li><li><strong>Incendios:</strong> aumentan, especialmente en Chiquitania (2019)</li></ul><p><strong>Acciones:</strong> energías renovables (ENDE), áreas protegidas (SERNAP), agricultura climáticamente inteligente.</p>"}, {"id": "ec4", "title": "Gestión de residuos", "xp": 60, "content": "<h3>♻️ Residuos sólidos</h3><p>Bolivia genera ~4.500 toneladas/día en ciudades principales; recicla menos del 5%.</p><p><strong>Ley 755 (2016):</strong> jerarquía de gestión: reducción → reutilización → reciclaje → valorización → disposición final.</p><p><strong>Iniciativas:</strong> eco-ladrillos, compostaje comunitario, recicladores (REDBOL), bancos de semillas nativas.</p>"}], "biodiversidad": [{"id": "b1", "title": "Recursos naturales de Bolivia", "xp": 60, "content": "<h3>⛏️ Recursos del territorio</h3><ul><li><strong>Litio:</strong> Salar de Uyuni, más de 20 millones de toneladas estimadas</li><li><strong>Gas natural y petróleo:</strong> principales reservas en Santa Cruz y Tarija</li><li><strong>Minerales:</strong> plata, estaño, zinc, oro, antimonio, cobre, hierro (Mutún)</li><li><strong>Agua y bosques:</strong> lago Titicaca, ríos amazónicos; casi la mitad del territorio es bosque</li></ul><p>La riqueza natural exige un equilibrio entre aprovechamiento y conservación.</p>"}, {"id": "b2", "title": "Áreas protegidas por departamento", "xp": 65, "content": "<h3>🏞️ ~24 áreas protegidas nacionales (≈20% del territorio, SERNAP)</h3><ul><li><strong>La Paz:</strong> Madidi, Cotapata, Apolobamba, Pilón Lajas</li><li><strong>Santa Cruz:</strong> Noel Kempff Mercado, Amboró, Kaa-Iya, San Matías, Otuquis</li><li><strong>Beni:</strong> Estación Biológica del Beni, TIPNIS</li><li><strong>Cochabamba:</strong> Carrasco, Tunari, Torotoro</li><li><strong>Potosí/Oruro:</strong> Sajama, Eduardo Avaroa</li><li><strong>Chuquisaca:</strong> El Palmar, Serranías del Iñao</li><li><strong>Tarija:</strong> Tariquia, Cordillera de Sama, Aguaragüe</li><li><strong>Pando:</strong> Manuripi</li></ul>"}, {"id": "b3", "title": "Animales en peligro de extinción", "xp": 65, "content": "<h3>🐆 Fauna amenazada</h3><p>Amenazas: agricultura, minería, caza y tráfico.</p><ul><li><strong>Jaguar</strong> (Panthera onca) — En Peligro: Madidi, Kaa-Iya, Noel Kempff</li><li><strong>Oso de anteojos</strong> (Tremarctos ornatus) — Andes y Yungas</li><li><strong>Nutria gigante</strong> — ríos amazónicos</li><li><strong>Delfín de río boliviano</strong> (Inia boliviensis) — endémico del Madeira</li><li><strong>Gato andino</strong> (Leopardus jacobita) — Altiplano</li><li><strong>Parabas</strong> barba azul y frente roja — Críticas</li><li><strong>Rana gigante del Titicaca</strong> (Telmatobius culeus) — Crítica</li><li><strong>Cóndor andino</strong> (Vultur gryphus)</li></ul>"}, {"id": "b4", "title": "Lugares turísticos naturales", "xp": 60, "content": "<h3>📸 Maravillas bolivianas</h3><ul><li><strong>Salar de Uyuni</strong> (Potosí): mayor desierto de sal del mundo; espejo natural en lluvias</li><li><strong>Madidi + Rurrenabaque:</strong> una de las zonas más biodiversas del planeta</li><li><strong>Titicaca e Isla del Sol:</strong> lago navegable más alto del mundo</li><li><strong>Eduardo Avaroa:</strong> Laguna Colorada, Verde, flamencos, géiseres</li><li><strong>Torotoro:</strong> huellas de dinosaurios, cañones, cavernas</li><li><strong>Sajama:</strong> nevado más alto de Bolivia, vicuñas, trekking</li><li><strong>Yungas de La Paz:</strong> bosques nublados y hábitat del tilcayo</li></ul>"}, {"id": "b5", "title": "Leopardus tilcayo: el felino de 2026", "xp": 80, "content": "<h3>🐆 Leopardus tilcayo (descrito en 2026)</h3><p>Primera especie de gato silvestre descrita formalmente en más de un siglo; publicada en <em>Current Biology</em> (septiembre 2026).</p><ul><li><strong>Tamaño:</strong> 42-50 cm de cuerpo + cola de 25-26,5 cm; ~1,3-2 kg</li><li><strong>Pelaje:</strong> marrón claro con grandes rosetas oscuras; rostro rayado</li><li><strong>Hábitat:</strong> Yungas de La Paz (Nor Yungas); localidad tipo cerca de Arapata (~1.570 m)</li><li><strong>Historia:</strong> el ejemplar 'Tigrino', criado por una familia y llevado a Senda Verde; el ADN confirmó una divergencia de ~1,4 millones de años</li></ul><p>⚠️ Se conoce en muy pocos ejemplares: urge proteger los Yungas frente a la deforestación.</p>"}]}, "flash": function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function shuffleA(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

async function handleLogin(){
  const email=document.getElementById('lemail').value.trim().toLowerCase();
  const pass=document.getElementById('lpass').value;
  if(!email||!pass){alert('Completa todos los campos');return;}
  const stored=DB.findUser(email);
  if(!stored){alert('No existe una cuenta con este correo. Regístrate.');goRegister();return;}
  if(stored.password&&stored.password!==pass){alert('Contraseña incorrecta.');return;}
  if(!stored.password)stored.password=pass;
  if(DB.firebaseOn){
    try{
      await DB.auth.signInWithEmailAndPassword(email,pass);
      const doc=await DB.fs.collection('users').doc(email).get();
      state.user=(doc.exists&&(doc.data().points||0)>(stored.points||0))?Object.assign({},doc.data(),{password:pass}):stored;
      DB.saveUser(state.user);
    }catch(e){
      if(e.code==='auth/user-not-found'){try{await DB.auth.createUserWithEmailAndPassword(email,pass);state.user=stored;DB.saveUser(state.user);}catch(e2){alert('Error de nube: '+e2.message);return;}}
      else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){alert('Contraseña incorrecta.');return;}
      else{alert('Error de conexión: '+e.message);return;}
    }
  } else state.user=stored;
  DB.setSession(state.user.email); state.page='app'; state.tab='inicio';
  mergeAchievements(state.user);
  updateStreak();
  checkAchievements();
  DB.saveUser(state.user);
  render();
  setTimeout(function(){ maybeNotifyStudyDays(); }, 600);
  if(!window._bioNotifInterval){
    window._bioNotifInterval=setInterval(function(){ maybeNotifyStudyDays(); }, 5*60*1000);
  }
}

async function handleRegister(){
  const name=document.getElementById('rname').value.trim();
  const email=document.getElementById('remail').value.trim().toLowerCase();
  const pass=document.getElementById('rpass').value;
  if(!name||!email||!pass){alert('Completa todos los campos');return;}
  if(pass.length<6){alert('La contraseña debe tener al menos 6 caracteres');return;}
  if(DB.findUser(email)){alert('Ya existe una cuenta con este correo.');goLogin();return;}
  if(DB.firebaseOn){try{await DB.auth.createUserWithEmailAndPassword(email,pass);}catch(e){alert('No se pudo crear en la nube: '+e.message);return;}}
  state.user=createUser(name,email,pass);
  DB.setSession(state.user.email); state.page='app'; state.tab='inicio'; render();
}

        if(other===100){a.unlocked=true;u.logros++;showXpPopup('🏆 Logro: Médico Comunitario');}
      }
    }
  });
  if(getTopicProgress('ecosistemas')===100){
    const a=u.achievements.find(x=>x.id==='eco');
    if(a&&!a.unlocked){a.unlocked=true;u.logros++;showXpPopup('🏆 Logro: Guardián Ambiental');}
  }
  DB.saveUser(u); render();
}

function buildFlashDeck(){
  const all = (CURRICULUM.flash[state.fcTopic]||[]).slice();
  const diff = state.fcDiff || 'media';
  let deck;
  if(diff==='facil'){
    deck = all.slice().sort((a,b)=>(a.q.length+a.a.length)-(b.q.length+b.a.length));
  } else if(diff==='dificil'){
    deck = shuffle(all.slice().sort((a,b)=>(b.q.length+b.a.length)-(a.q.length+a.a.length)));
  } else {
    deck = shuffle(all.slice());
  }
  // ids estables para no repetir en la sesión
  state.fcDeck = deck.map((card,i)=>({q:card.q, a:card.a, id: state.fcTopic+'_'+i+'_'+String(card.q).slice(0,24)}));
  state.fcIndex = 0;
  state.fcFlipped = false;
  if(!state.fcStudied) state.fcStudied = {};
  // clave de sesión por tema+diff
  state.fcSessionKey = state.fcTopic+'|'+diff;
  if(!state.fcStudied[state.fcSessionKey]) state.fcStudied[state.fcSessionKey] = {};
}

function getFlashDeck(){
  if(!state.fcDeck || !state.fcDeck.length || state.fcSessionKey !== (state.fcTopic+'|'+(state.fcDiff||'media'))){
    buildFlashDeck();
  }
  return state.fcDeck || [];
}

function fcIsStudied(id){
  const key = state.fcSessionKey || (state.fcTopic+'|'+(state.fcDiff||'media'));
  return !!(state.fcStudied && state.fcStudied[key] && state.fcStudied[key][id]);
}

function fcMarkStudied(id){
  const key = state.fcSessionKey || (state.fcTopic+'|'+(state.fcDiff||'media'));
  if(!state.fcStudied) state.fcStudied = {};
  if(!state.fcStudied[key]) state.fcStudied[key] = {};
  state.fcStudied[key][id] = true;
}

function fcStudiedCount(){
  const cards = getFlashDeck();
  return cards.filter(c=>fcIsStudied(c.id)).length;
}

function fcNextUnstudiedIndex(from){
  const cards = getFlashDeck();
  if(!cards.length) return -1;
  const n = cards.length;
  for(let step=1; step<=n; step++){
    const i = (from + step) % n;
    if(!fcIsStudied(cards[i].id)) return i;
  }
  return -1; // todas estudiadas
}

// Voltear sin redibujar toda la app (evita lag)
function flipCard(){
  state.fcFlipped = !state.fcFlipped;
  const el = document.getElementById('fc-card-el');
  if(el){
    el.classList.toggle('flipped', state.fcFlipped);
  } else {
    render();
  }
}

function fcPaintCurrent(){
  const cards = getFlashDeck();
  if(!cards.length){ render(); return; }
  if(state.fcIndex < 0 || state.fcIndex >= cards.length) state.fcIndex = 0;
  const card = cards[state.fcIndex];
  const q = document.getElementById('fc-q');
  const a = document.getElementById('fc-a');
  const el = document.getElementById('fc-card-el');
  const counter = document.getElementById('fc-counter');
  state.fcFlipped = false;
  if(el) el.classList.remove('flipped');
  if(q) q.textContent = card.q;
  if(a) a.textContent = card.a;
  if(counter){
    const studied = fcStudiedCount();
    counter.textContent = studied + ' hechas · ficha ' + (state.fcIndex+1) + '/' + cards.length;
  }
  // si no hay nodos (primera vez), render completo
  if(!q || !a) render();
}

function nextCard(){
  const cards = getFlashDeck();
  if(!cards.length) return;
  const ni = fcNextUnstudiedIndex(state.fcIndex);
  if(ni < 0){
    // todas hechas → pantalla final
    render();
    return;
  }
  state.fcIndex = ni;
  state.fcFlipped = false;
  // si faltan pocas, mejor re-render para actualizar barra; si no, paint rápido
  if(fcStudiedCount() >= cards.length - 1) render();
  else fcPaintCurrent();
}

function prevCard(){
  const cards = getFlashDeck();
  if(!cards.length) return;
  // anterior no estudiada hacia atrás
  const n = cards.length;
  for(let step=1; step<=n; step++){
    const i = (state.fcIndex - step + n) % n;
    if(!fcIsStudied(cards[i].id)){
      state.fcIndex = i;
      state.fcFlipped = false;
      fcPaintCurrent();
      return;
    }
  }
  render(); // todas hechas
}

function skipCard(){
  // pasar sin marcar como sabida (tampoco da XP)
  const cards = getFlashDeck();
  if(!cards.length) return;
  // buscar siguiente distinta (aunque esté estudiada no, solo pendientes)
  const ni = fcNextUnstudiedIndex(state.fcIndex);
  if(ni < 0){ render(); return; }
  // si solo queda la actual, no hacer bucle infinito: marcar visual
  if(ni === state.fcIndex){ render(); return; }
  state.fcIndex = ni;
  state.fcFlipped = false;
  fcPaintCurrent();
}

function studyCard(){
  const cards = getFlashDeck();
  if(!cards.length || !state.user) return;
  const card = cards[state.fcIndex];
  if(!card) return;
  // no dar XP dos veces por la misma ficha en la sesión
  if(fcIsStudied(card.id)){
    nextCard();
    return;
  }
  fcMarkStudied(card.id);
  const xpAmt = state.fcDiff==='dificil'?10:(state.fcDiff==='facil'?3:5);
  state.user.totalFlashcards = (state.user.totalFlashcards||0)+1;
  checkAchievements();
  DB.saveUser(state.user);
  addXp(xpAmt, 'Ficha estudiada', true); // skipRender → sin lag
  showXpPopup('+'+xpAmt+' XP · Ficha');
  // siguiente pendiente o fin
  const ni = fcNextUnstudiedIndex(state.fcIndex);
  if(ni < 0){
    render(); // pantalla de mazo completo
    return;
  }
  state.fcIndex = ni;
  state.fcFlipped = false;
  // actualizar progreso: render ligero del tab
  render();
}

function fcResetDeck(){
  const key = state.fcSessionKey || (state.fcTopic+'|'+(state.fcDiff||'media'));
  if(state.fcStudied) state.fcStudied[key] = {};
  buildFlashDeck();
  showXpPopup('Mazo reiniciado');
  render();
}

function calShiftMonth(delta){
  const now=new Date();
  if(state.calMonth==null) state.calMonth=now.getMonth();
  if(state.calYear==null) state.calYear=now.getFullYear();
  state.calMonth+=delta;
  if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
  if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
  render();
}

function calDayClick(dateStr, dayNum){
  if(!state.user) return;
  if(!state.user.studyDays) state.user.studyDays=[];
  const exists=state.user.studyDays.find(s=>s.date===dateStr);
  if(exists){
    if(confirm('¿Quitar el estudio del '+dateStr+'?')){
      state.user.studyDays=state.user.studyDays.filter(s=>s.date!==dateStr);
      DB.saveUser(state.user);
      showXpPopup('Día quitado');
      render();
    }
    return;
  }
  const note=prompt('Nota para el '+dateStr+' (opcional):\nEj: Repasar genética, examen oral…','Estudiar biología');
  if(note===null) return; // cancel
  state.user.studyDays.push({date:dateStr, note:(note||'Estudiar').slice(0,120), created:Date.now()});
  checkAchievements();
  DB.saveUser(state.user);
  showXpPopup('🔔 Estudio marcado: '+dateStr);
  // intentar notificar si es hoy
  maybeNotifyStudyDays();
  render();
}

function calRemoveDay(dateStr){
  if(!state.user||!state.user.studyDays) return;
  state.user.studyDays=state.user.studyDays.filter(s=>s.date!==dateStr);
  DB.saveUser(state.user);
  render();
}

function enableStudyNotifs(){
  if(typeof Notification==='undefined'){
    alert('Tu navegador no soporta notificaciones.');
    return;
  }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){
      showXpPopup('🔔 Notificaciones activadas');
      maybeNotifyStudyDays(true);
      try{
        new Notification('BIOEXPLORA',{body:'Alarmas de estudio activadas. Te avisaremos en tus días marcados.',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌿</text></svg>'});
      }catch(e){}
    } else {
      alert('Permiso denegado. Puedes activarlo en la configuración del navegador.');
    }
    render();
  });
}

function maybeNotifyStudyDays(force){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  if(!state.user||!state.user.studyDays) return;
  const today=new Date().toISOString().slice(0,10);
  const key='bioexplora_notif_'+today;
  const already=localStorage.getItem(key);
  const todays=state.user.studyDays.filter(s=>s.date===today);
  if(todays.length && (!already || force)){
    localStorage.setItem(key,'1');
    const notes=todays.map(s=>s.note||'Estudiar').join(' · ');
    try{
      new Notification('📚 BIOEXPLORA — ¡Hoy estudias!',{
        body: notes,
        tag:'bioexplora-study-'+today
      });
    }catch(e){}
    showXpPopup('📚 ¡Hoy tienes estudio marcado!');
  }
  // aviso de mañana (una vez)
  const tom=new Date(); tom.setDate(tom.getDate()+1);
  const tomStr=tom.toISOString().slice(0,10);
  const key2='bioexplora_notif_tom_'+tomStr;
  const toms=state.user.studyDays.filter(s=>s.date===tomStr);
  if(toms.length && !localStorage.getItem(key2)){
    localStorage.setItem(key2,'1');
    try{
      new Notification('⏰ BIOEXPLORA — Mañana estudias',{
        body:toms.map(s=>s.note||'Estudiar').join(' · '),
        tag:'bioexplora-study-tom-'+tomStr
      });
    }catch(e){}
  }
}

function setRevStar(n){
  const input=document.getElementById('rev-rating');
  if(input) input.value=n;
  document.querySelectorAll('#rev-stars .tab-btn').forEach(btn=>{
    const s=parseInt(btn.getAttribute('data-star'),10);
    btn.textContent = s<=n ? '★' : '☆';
    btn.classList.toggle('active', s<=n);
  });
}

function submitReview(){
  const text=(document.getElementById('rev-text')?.value||'').trim();
  if(text.length<5){ alert('Escribe al menos unas palabras (mín. 5 caracteres).'); return; }
  if(text.length>1000){ alert('Máximo 1000 caracteres.'); return; }
  const type=document.getElementById('rev-type')?.value||'reseña';
  const rating=Math.min(5, Math.max(1, parseInt(document.getElementById('rev-rating')?.value,10)||5));
  const u=state.user;
  const r={
    id: 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name: u?.name||'Anónimo',
    email: u?.email||'',
    type, rating, text,
    date: new Date().toLocaleDateString('es-ES',{year:'numeric',month:'short',day:'numeric'})
  };
  DB.addReview(r);
  if(state.user){
    state.user.reviewsPosted=(state.user.reviewsPosted||0)+1;
    checkAchievements();
    DB.saveUser(state.user);
  }
  showXpPopup('💬 ¡Gracias por tu opinión!');
  // pequeña recompensa la primera vez del día
  try{
    const key='bioexplora_review_xp_'+new Date().toDateString();
    if(!localStorage.getItem(key) && u){
      localStorage.setItem(key,'1');
      addXp(10,'Reseña enviada', true);
    }
  }catch(e){}
  render();
}

function deleteMyReview(id){
  if(!state.user) return;
  if(!confirm('¿Eliminar tu reseña?')) return;
  DB.deleteReview(id, state.user.email);
  showXpPopup('Reseña eliminada');
  render();
}

async function changePass(){
  const now=document.getElementById('acc-pass-now').value;
  const nw=document.getElementById('acc-pass-new').value;
  if(!now||!nw){alert('Completa ambos campos');return;}
  if(nw.length<6){alert('Mínimo 6 caracteres');return;}
  if(state.user.password&&state.user.password!==now){alert('La contraseña actual no coincide');return;}
  state.user.password=nw; DB.saveUser(state.user);
  if(DB.firebaseOn&&DB.auth.currentUser){
    try{ await DB.auth.currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(state.user.email,now));
      await DB.auth.currentUser.updatePassword(nw); }catch(e){}
  }
  alert('🔑 Contraseña actualizada'); document.getElementById('acc-pass-now').value=''; document.getElementById('acc-pass-new').value='';
}

function deleteAccount(){
  if(!confirm('¿Eliminar tu cuenta PERMANENTEMENTE? Se borrarán tus puntos y progreso.'))return;
  const check=prompt('Escribe tu correo para confirmar:');
  if(norm(check)!==state.user.email){alert('Correo no coincide. Cancelado.');return;}
  DB.deleteUser(state.user.email);
  if(DB.auth)DB.auth.currentUser&&DB.auth.currentUser.delete().catch(function(){});
  logout();
}

function searchContent(q){
  q=norm(q); if(q.length<2)return;
  const results=[];
  CURRICULUM.topics.forEach(t=>{ if(norm(t.name).includes(q)||norm(t.desc).includes(q)) results.push({type:'Tema',text:t.name,fn:function(){state.lessonTopic=t.id;navTab('lecciones');}}); });
  Object.keys(CURRICULUM.lessons).forEach(tid=>CURRICULUM.lessons[tid].forEach(l=>{
    if(norm(l.title).includes(q)) results.push({type:'Lección',text:l.title,fn:function(){state.lessonTopic=tid;state.lessonView=l.id;navTab('lecciones');state.lessonView=l.id;render();}});
  }));
  if(!results.length){alert('Sin resultados para: '+q);return;}
  const list=results.slice(0,5).map((r,i)=>(i+1)+'. ['+r.type+'] '+r.text).join('\n');
  const c=prompt('Resultados:\n'+list+'\n\nNúmero para ir:');
  const idx=parseInt(c)-1; if(results[idx])results[idx].fn();
}

const COUNT_GAMES={
  memoria:{label:'pares', def:{facil:8,media:10,dificil:12}},
  sopaletras:{label:'palabras', def:{facil:8,media:10,dificil:12}},
  crucigrama:{label:'palabras', def:{facil:8,media:10,dificil:12}},
  quiz:{label:'preguntas', def:{facil:8,media:10,dificil:12}},
  vf:{label:'afirmaciones', def:{facil:8,media:10,dificil:12}},
  relacionar:{label:'pares', def:{facil:8,media:10,dificil:12}},
  completar:{label:'palabras', def:{facil:8,media:10,dificil:12}},
  carrera:{label:'segundos', def:{facil:60,media:45,dificil:30}, min:15}, // tiempo: mínimo 15s
  adivinanzas:{label:'adivinanzas', def:{facil:8,media:10,dificil:12}},
  imagenes:{label:'fotos', def:{facil:8,media:10,dificil:12}},
  clasifica:{label:'elementos', def:{facil:8,media:10,dificil:12}},
  ruleta:{label:'giros', def:{facil:8,media:10,dificil:12}}
};

function showGameCountSetup(diff){
  const el=document.getElementById('game-area');
  if(!el) return;
  const id=state.gameId;
  const meta=COUNT_GAMES[id];
  const dname=(GAME_DIFFS.find(d=>d.id===diff)||{}).name||diff;

  // Juegos sin cantidad (p.ej. tilcayo): arrancar directo
  if(!meta){
    const fn=window['g_'+id];
    if(fn)fn(state.gameTopic, diff);
    return;
  }

  const minC = meta.min!=null ? meta.min : 8;
  const defC = (meta.def&&meta.def[diff]) || minC;
  if(state.gameCount==null || state.gameCount<minC) state.gameCount=defC;

  const isMem = id==='memoria';
  let modeUI = '';
  if(isMem){
    modeUI = `<p style="font-size:14px;font-weight:600;color:var(--gray600);margin:14px 0 10px;">Tipo de juego:</p>
    <div class="grid-2 mb-3">
      <div class="diff-card" style="${state.memMode==='qa'?'border-color:var(--g500);background:var(--g50)':''}" onclick="state.memMode='qa';showGameCountSetup('${diff}')">
        <div style="font-size:28px;">📝</div>
        <div style="font-weight:700;font-size:13px;">Preguntas y respuestas</div>
      </div>
      <div class="diff-card" style="${state.memMode==='img'?'border-color:var(--g500);background:var(--g50)':''}" onclick="state.memMode='img';showGameCountSetup('${diff}')">
        <div style="font-size:28px;">🖼️</div>
        <div style="font-weight:700;font-size:13px;">Imágenes pares</div>
      </div>
    </div>`;
  }

  el.innerHTML=`<div class="card" style="max-width:520px;margin:0 auto;">
    <div class="section-title" style="font-size:18px;">${(GAMES.find(g=>g.id===id)||{}).icon||''} ${(GAMES.find(g=>g.id===id)||{}).name||id} · ${dname}</div>
    <p style="font-size:14px;font-weight:600;color:var(--gray700);margin:12px 0 8px;">¿Cuántos/as ${meta.label}? <span style="font-weight:500;color:var(--gray500)">(mínimo ${minC} · sin máximo)</span></p>
    <div class="flex items-center justify-center gap-2 wrap mb-2">
      <button class="btn-secondary" style="padding:8px 14px;font-size:18px;" onclick="state.gameCount=Math.max(${minC},(state.gameCount||${minC})-1);showGameCountSetup('${diff}')">−</button>
      <input type="number" min="${minC}" id="game-count-input" value="${state.gameCount}" style="width:90px;text-align:center;padding:10px;border-radius:10px;border:1.5px solid var(--gray300);font-size:20px;font-weight:700;" onchange="state.gameCount=Math.max(${minC},parseInt(this.value)||${minC});showGameCountSetup('${diff}')">
      <button class="btn-secondary" style="padding:8px 14px;font-size:18px;" onclick="state.gameCount=(state.gameCount||${minC})+1;showGameCountSetup('${diff}')">+</button>
    </div>
    ${modeUI}
    <button class="btn-primary w-full mt-2" onclick="confirmGameStart()">${isMem && !state.memMode?'▶ Elige tipo y empieza':'▶ Empezar'}</button>
    <button class="btn-secondary mt-2 w-full" onclick="state.gameId=null;state.gameDiff=null;state.memMode=null;state.gameCount=null;render()">← Cancelar</button>
  </div>`;
  window.scrollTo({top:el.offsetTop-80,behavior:'smooth'});
}

function confirmGameStart(){
  const id=state.gameId;
  const meta=COUNT_GAMES[id];
  const minC = (meta&&meta.min!=null) ? meta.min : 8;
  state.gameCount = Math.max(minC, parseInt(state.gameCount,10)||minC);
  const fn=window['g_'+id];
  if(!fn){showXpPopup('Juego no disponible');return;}
  if(id==='memoria'){
    if(!state.memMode){ showXpPopup('👆 Elige preguntas/respuestas o imágenes'); return; }
    fn(state.gameTopic, state.gameDiff, state.memMode, state.gameCount);
  } else if(id==='sopaletras' || id==='crucigrama') {
    fn(state.gameTopic, state.gameDiff, state.gameCount);
  } else if(id==='carrera') {
    fn(state.gameTopic, state.gameDiff, state.gameCount);
  } else {
    fn(state.gameTopic, state.gameDiff, state.gameCount);
  }
  setTimeout(()=>{
    const el=document.getElementById('game-area');
    if(el) window.scrollTo({top:el.offsetTop-80,behavior:'smooth'});
  },50);
}
